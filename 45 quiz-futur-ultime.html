  { t: "Vous ___ devant l'école avant la sonnerie.", v: "être", a: "serez", e: "🏫" },
  { t: "Le chien ___ se cacher derrière le sofa.", v: "vouloir", a: "voudra", e: "🐶" },
  { t: "Il ___ au-dessus de la forêt.", v: "pleuvoir", a: "pleuvra", e: "🌲" },
  { t: "Demain, j'___ mon sac en dessous du banc.", v: "avoir", a: "aurai", e: "🎒" },
  { t: "Nous ___ à côté de nos amis dans le car.", v: "être", a: "serons", e: "🚌" },
  { t: "Tu ___ un nid dans le grand chêne.", v: "voir", a: "verras", e: "🪺" },
  { t: "Je ___ passer entre les deux arbres.", v: "pouvoir", a: "pourrai", e: "🌳" },
  { t: "En bas de la colline, nous ___ un petit village.", v: "voir", a: "verrons", e: "🏘️" },
  { t: "Pour aller en haut de la tour, il ___ monter cent marches.", v: "falloir", a: "faudra", e: "🗼" },
  // courir et mourir
  { t: "À la récréation, les enfants ___ dans la cour.", v: "courir", a: "courront", e: "🏃" },
  { t: "Demain, nous ___ dix tours de stade.", v: "courir", a: "courrons", e: "🏟️" },
  { t: "Tu ___ plus vite que moi !", v: "courir", a: "courras", e: "👟" },
  { t: "Le guépard ___ après la gazelle dans la savane.", v: "courir", a: "courra", e: "🐆" },
  { t: "Sans eau, les fleurs du jardin ___.", v: "mourir", a: "mourront", e: "🥀" },
  { t: "Si tu oublies de l'arroser, ma plante ___.", v: "mourir", a: "mourra", e: "🌱" },
  { t: "Je ___ de rire en regardant ce film !", v: "mourir", a: "mourrai", e: "😂" }
];

G1.forEach(q => q.g = 1);
G2.forEach(q => q.g = 2);
G3.forEach(q => q.g = 3);

const NB_G1 = 4, NB_G2 = 4, NB_G3 = 7;
const NB_QUESTIONS = NB_G1 + NB_G2 + NB_G3; // 15
const CONFETTI = ["🎉","⭐","🌈","🎈","✨","🍀","🦄"];

let questions = [];
let index = 0;
let score = 0;
let answered = false;
let mistakes = [];
let groupScore = { 1: 0, 2: 0, 3: 0 };

const $ = id => document.getElementById(id);

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Tire n phrases au hasard avec des verbes tous différents */
function pickDistinct(arr, n) {
  const res = [];
  const used = new Set();
  for (const q of shuffle(arr)) {
    if (!used.has(q.v)) {
      used.add(q.v);
      res.push(q);
      if (res.length === n) break;
    }
  }
  return res;
}

function normalize(s) {
  return s.trim().toLowerCase().replace(/[’`´]/g, "'").replace(/\s+/g, " ");
}
function stripAccents(s) {
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function show(id) {
  ["screen-start", "screen-quiz", "screen-end"].forEach(s => $(s).classList.add("hidden"));
  $(id).classList.remove("hidden");
}

function startQuiz() {
  questions = shuffle([
    ...pickDistinct(G1, NB_G1),
    ...pickDistinct(G2, NB_G2),
    ...pickDistinct(G3, NB_G3)
  ]);
  index = 0;
  score = 0;
  mistakes = [];
  groupScore = { 1: 0, 2: 0, 3: 0 };
  show("screen-quiz");
  showQuestion();
}

function fullSentence(q, word) {
  return q.t.replace("___", word);
}

function showQuestion() {
  const q = questions[index];
  answered = false;
  $("count").textContent = "Question " + (index + 1) + " / " + NB_QUESTIONS;
  $("score").textContent = "⭐ " + score;
  $("progress").style.width = (index / NB_QUESTIONS * 100) + "%";
  $("q-emoji").textContent = q.e;

  const box = $("sentence");
  box.textContent = "";
  const parts = q.t.split("___");
  box.appendChild(document.createTextNode(parts[0]));

  const input = document.createElement("input");
  input.type = "text";
  input.id = "answer";
  input.autocomplete = "off";
  input.autocapitalize = "none";
  input.spellcheck = false;
  input.setAttribute("aria-label", "Ta réponse");
  input.setAttribute("inputmode", "none"); // évite le clavier système sur tablette
  setKeyboardEnabled(true);
  box.appendChild(input);

  const verb = document.createElement("span");
  verb.className = "verb";
  verb.textContent = q.v;
  box.appendChild(verb);

  box.appendChild(document.createTextNode(parts[1]));

  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  $("btn-check").classList.remove("hidden");
  $("btn-next").classList.add("hidden");
  input.focus();
}

function launchConfetti() {
  const card = $("card");
  for (let i = 0; i < 14; i++) {
    const c = document.createElement("span");
    c.className = "confetti";
    c.textContent = CONFETTI[Math.floor(Math.random() * CONFETTI.length)];
    c.style.left = Math.random() * 95 + "%";
    c.style.animationDelay = (Math.random() * 0.4) + "s";
    card.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

function checkAnswer() {
  if (answered) return;
  const q = questions[index];
  const input = $("answer");
  const given = normalize(input.value);
  if (given === "") {
    input.focus();
    return;
  }
  answered = true;
  input.disabled = true;
  setKeyboardEnabled(false);
  const expected = normalize(q.a);
  const fb = $("feedback");

  if (given === expected) {
    score++;
    groupScore[q.g]++;
    fb.className = "feedback ok bounce";
    fb.textContent = "🎉 Bravo ! " + fullSentence(q, q.a);
    launchConfetti();
  } else if (stripAccents(given) === stripAccents(expected)) {
    fb.className = "feedback almost shake";
    fb.textContent = "😮 Presque ! Fais attention aux accents. Il fallait écrire : " + q.a;
    mistakes.push(q);
  } else {
    fb.className = "feedback ko shake";
    fb.textContent = "🤔 Pas tout à fait. La bonne réponse est : " + q.a +
                     " (" + fullSentence(q, q.a) + ")";
    mistakes.push(q);
  }
  $("score").textContent = "⭐ " + score;
  $("btn-check").classList.add("hidden");
  $("btn-next").classList.remove("hidden");
  $("btn-next").textContent = (index === NB_QUESTIONS - 1) ? "Voir mon score 🏁" : "Suivant ➡️";
  $("btn-next").focus();
}

function nextQuestion() {
  index++;
  if (index >= NB_QUESTIONS) {
    endQuiz();
  } else {
    showQuestion();
  }
}

function endQuiz() {
  $("progress").style.width = "100%";
  show("screen-end");
  $("end-score").textContent = score + " / " + NB_QUESTIONS;

  const nbStars = score >= 14 ? 3 : score >= 10 ? 2 : score >= 5 ? 1 : 0;
  $("end-stars").textContent = "⭐".repeat(nbStars) + "☆".repeat(3 - nbStars);

  const gs = $("group-scores");
  gs.textContent = "";
  [
    { g: 1, label: "1er groupe", total: NB_G1 },
    { g: 2, label: "2e groupe", total: NB_G2 },
    { g: 3, label: "3e groupe", total: NB_G3 }
  ].forEach(x => {
    const s = document.createElement("span");
    s.className = "g" + x.g;
    s.textContent = x.label + " : " + groupScore[x.g] + " / " + x.total;
    gs.appendChild(s);
  });

  let msg;
  if (score === NB_QUESTIONS) {
    msg = "🏆 PARFAIT ! Tu es un(e) champion(ne) du futur, tous groupes confondus !";
  } else if (score >= 12) {
    msg = "🌟 Bravo ! Tu maîtrises très bien le futur. Encore un petit effort pour le sans-faute !";
  } else if (score >= 8) {
    msg = "👍 Bien joué ! Tu es sur la bonne voie. Avec un nouvel essai, tu feras encore mieux !";
  } else {
    msg = "💪 Courage ! Le futur demande de l'entraînement. Relis tes erreurs et retente ta chance, tu vas y arriver !";
  }
  $("end-message").textContent = msg + " Tu veux recommencer avec de nouvelles phrases ?";

  const review = $("review");
  review.textContent = "";
  if (mistakes.length > 0) {
    review.classList.remove("hidden");
    const h = document.createElement("h3");
    h.textContent = "📖 À revoir :";
    review.appendChild(h);
    const ul = document.createElement("ul");
    mistakes.forEach(q => {
      const li = document.createElement("li");
      const strong = document.createElement("span");
      strong.className = "good";
      strong.textContent = q.a;
      li.appendChild(document.createTextNode(q.e + " " + q.v + " → "));
      li.appendChild(strong);
      li.appendChild(document.createTextNode(" : " + fullSentence(q, q.a)));
      ul.appendChild(li);
    });
    review.appendChild(ul);
  } else {
    review.classList.add("hidden");
  }
  if (score >= 10) launchConfetti();
}

/* ---------- Clavier à l'écran ---------- */
const KB_ROWS = [
  { keys: ["a","z","e","r","t","y","u","i","o","p"], cls: "c0" },
  { keys: ["q","s","d","f","g","h","j","k","l","m"], cls: "c1" },
  { keys: ["w","x","c","v","b","n"], cls: "c2", back: true },
  { keys: ["é","è","ê","à","â","ù","û","î","ï","ô","ë","ç"], cls: "accent" }
];

function typeChar(ch) {
  const inp = $("answer");
  if (!inp || inp.disabled) return;
  inp.focus();
  const s = inp.selectionStart == null ? inp.value.length : inp.selectionStart;
  const e = inp.selectionEnd == null ? s : inp.selectionEnd;
  inp.setRangeText(ch, s, e, "end");
}

function backspace() {
  const inp = $("answer");
  if (!inp || inp.disabled) return;
  inp.focus();
  let s = inp.selectionStart == null ? inp.value.length : inp.selectionStart;
  const e = inp.selectionEnd == null ? s : inp.selectionEnd;
  if (s === e) {
    if (s === 0) return;
    s = s - 1;
  }
  inp.setRangeText("", s, e, "end");
}

function setKeyboardEnabled(on) {
  $("keyboard").classList.toggle("disabled", !on);
}

function makeKey(label, cls, onPress) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "key " + cls;
  b.textContent = label;
  // pointerdown + preventDefault : le champ garde le focus et la tablette
  // n'ouvre pas son propre clavier.
  b.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    onPress();
  });
  b.addEventListener("contextmenu", ev => ev.preventDefault());
  return b;
}

function buildKeyboard() {
  const kb = $("keyboard");
  kb.textContent = "";
  KB_ROWS.forEach(r => {
    const row = document.createElement("div");
    row.className = "kb-row";
    r.keys.forEach(k => row.appendChild(makeKey(k, r.cls, () => typeChar(k))));
    if (r.back) row.appendChild(makeKey("⌫ Effacer", "back", backspace));
    kb.appendChild(row);
  });
}
buildKeyboard();

$("btn-start").addEventListener("click", startQuiz);
$("btn-restart").addEventListener("click", startQuiz);
$("btn-check").addEventListener("click", checkAnswer);
$("btn-next").addEventListener("click", nextQuestion);

document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if ($("screen-quiz").classList.contains("hidden")) return;
  e.preventDefault();
  if (!answered) checkAnswer(); else nextQuestion();
});
</script>
