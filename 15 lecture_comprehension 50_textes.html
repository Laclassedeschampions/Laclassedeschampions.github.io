<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Je comprends ! — CM1-CM2</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;background:linear-gradient(135deg,#bae6fd,#ddd6fe 52%,#fbcfe8);color:#26324a;display:flex;justify-content:center;align-items:center}
.app{width:min(900px,100%);background:#fff;border-radius:30px;padding:28px;box-shadow:0 18px 55px #0002}h1{text-align:center;margin:0 0 5px;font-size:clamp(30px,5vw,46px)}.subtitle{text-align:center;color:#667085;margin:0 0 20px;font-size:18px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}.badge,.score{padding:9px 16px;border-radius:999px;font-weight:bold}.badge{background:#ede9fe;color:#6d28d9}.score{background:#ffedd5;color:#c2410c}
.card{background:#f8fafc;border:3px solid #dbeafe;border-radius:24px;padding:25px;max-width:780px;margin:auto}.theme{font-size:15px;font-weight:bold;color:#7c3aed;margin-bottom:10px;text-transform:uppercase}.text{font-family:Georgia,serif;font-size:23px;line-height:1.58;color:#172033}.question{margin-top:24px;padding:17px 19px;background:#fff;border-radius:18px;border:2px solid #e2e8f0;font-size:21px;font-weight:bold}
.answers{display:grid;gap:12px;margin-top:16px}.answer{border:3px solid #cbd5e1;background:#fff;border-radius:16px;padding:15px 18px;text-align:left;font-size:19px;font-weight:bold;cursor:pointer}.answer:hover{background:#eef2ff;border-color:#a5b4fc}.answer.correct{background:#dcfce7;border-color:#22c55e;color:#166534}.answer.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.feedback{text-align:center;min-height:42px;padding-top:16px;font-size:20px;font-weight:bold}.next,.restart{border:0;border-radius:17px;color:#fff;padding:14px 26px;font-size:19px;font-weight:bold;cursor:pointer}.next{display:none;margin:8px auto;background:#7c3aed;box-shadow:0 5px #5b21b6}.restart{background:#f97316;box-shadow:0 5px #c2410c}
.overlay{position:fixed;inset:0;background:#23194699;display:none;align-items:center;justify-content:center;padding:20px}.modal{width:min(570px,100%);background:#fff;border-radius:30px;padding:35px;text-align:center;box-shadow:0 20px 60px #0005}.modal h2{font-size:38px;margin:0 0 10px}.final-score{font-size:68px;font-weight:bold;color:#7c3aed;margin:10px}
@media(max-width:600px){.app{padding:19px}.card{padding:18px}.text{font-size:20px}.question{font-size:19px}.answer{font-size:17px}}
</style></head>
<body><main class="app"><h1>📚 Je comprends !</h1><p class="subtitle">À chaque partie, 10 textes sont choisis au hasard dans une banque de 50 textes.</p>
<div class="top"><div class="badge" id="round"></div><div class="score" id="score"></div></div>
<section class="card"><div class="theme" id="theme"></div><div class="text" id="text"></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Question suivante →</button></section></main>
<div class="overlay" id="overlay"><div class="modal"><div style="font-size:40px">🎉 📚 ⭐</div><h2 id="finalTitle"></h2><div class="final-score" id="finalScore"></div><p id="finalMessage" style="font-size:19px;line-height:1.5"></p><button class="restart" id="restart">🔄 Nouvelle partie</button></div></div>
<script>
const corpus=[["Compréhension explicite", "Vie de classe", "À huit heures, Maël accroche son manteau et sort son cahier de mathématiques. Il prend un crayon puis s'assoit à sa place.", "Que sort Maël de son cartable ?", ["Son cahier de mathématiques", "Son goûter", "Son livre"], 0], ["Compréhension explicite", "Vie de classe", "Pour une expérience, les élèves se mettent par groupes de quatre. Chaque groupe reçoit un verre, une cuillère et un peu de sel.", "Combien d'élèves y a-t-il dans chaque groupe ?", ["Trois", "Quatre", "Cinq"], 1], ["Compréhension explicite", "Vie de classe", "Lina va au coin bibliothèque et choisit un album sur les animaux. Elle revient ensuite à sa table pour le lire.", "Quel livre choisit Lina ?", ["Un album sur les animaux", "Un dictionnaire", "Un livre de mathématiques"], 0], ["Compréhension implicite", "Vie de classe", "Clara relit son exercice, trouve une erreur dans une phrase et la corrige avant de lever la main.", "Pourquoi Clara relit-elle son exercice ?", ["Pour vérifier son travail", "Pour chercher son cartable", "Pour sortir de la classe"], 0], ["Compréhension implicite", "Vie de classe", "Hugo doit présenter un exposé. Il regarde plusieurs fois ses notes et respire profondément avant de commencer.", "Comment Hugo se sent-il probablement ?", ["Un peu stressé", "Très en colère", "Très endormi"], 0], ["Compréhension explicite", "Journée à l'école", "À dix heures, la classe sort dans la cour. Après quinze minutes, la cloche sonne et les élèves se rangent avant de rentrer.", "Quand les élèves rentrent-ils en classe ?", ["Après la cloche", "Avant la récréation", "À midi"], 0], ["Compréhension explicite", "Journée à l'école", "Après le déjeuner, les élèves ont une séance de sciences. Ils observent des graines plantées quelques jours plus tôt.", "Quelle matière travaillent-ils ?", ["Les sciences", "La géographie", "La musique"], 0], ["Compréhension explicite", "Journée à l'école", "Le mardi, la classe commence par une lecture silencieuse. Ensuite viennent les mathématiques puis la récréation.", "Quelle activité a lieu en premier ?", ["Les mathématiques", "La lecture silencieuse", "La récréation"], 1], ["Compréhension implicite", "Journée à l'école", "Noah regarde l'horloge : il est presque quatre heures. Il range ses cahiers et vérifie qu'il a son manteau. Quelques minutes plus tard, la sonnerie retentit.", "Pourquoi Noah prépare-t-il ses affaires ?", ["La journée va bientôt finir", "Il va déjeuner", "Il va faire une expérience"], 0], ["Compréhension implicite", "Journée à l'école", "Après le déjeuner, les élèves bâillent encore. La maîtresse baisse les stores et leur demande de s'installer calmement.", "Pourquoi sont-ils probablement moins dynamiques ?", ["Ils sont encore fatigués", "Ils ont froid", "Ils vont courir"], 0], ["Compréhension explicite", "Animaux de la ferme", "Dans le poulailler, les poules picorent des graines. Le fermier ramasse quelques œufs et les dépose dans un panier.", "Que ramasse le fermier ?", ["Des œufs", "Des plumes", "Des carottes"], 0], ["Compréhension explicite", "Animaux de la ferme", "Paul apporte une botte de foin à la vache Blanche. Elle commence aussitôt à manger.", "Que mange la vache ?", ["Du foin", "Des graines", "Des pommes"], 0], ["Compréhension explicite", "Animaux de la ferme", "Les canards avancent vers la mare. L'un entre dans l'eau et les autres le suivent.", "Où vont les canards ?", ["À la mare", "Dans le poulailler", "Dans l'étable"], 0], ["Compréhension implicite", "Animaux de la ferme", "Le petit agneau s'éloigne du troupeau et pousse de petits cris. Sa mère marche rapidement vers lui.", "Pourquoi la brebis rejoint-elle probablement l'agneau ?", ["Pour le protéger", "Pour chercher de l'eau", "Pour quitter la ferme"], 0], ["Compréhension implicite", "Animaux de la ferme", "Le coq chante très tôt. Dans la maison voisine, la famille commence à se réveiller et le soleil apparaît.", "À quel moment cette scène se passe-t-elle probablement ?", ["Le matin", "L'après-midi", "Le soir"], 0], ["Compréhension explicite", "Repas", "À la cantine, Zoé mange des crudités, du poisson avec des pommes de terre et un yaourt à la fraise.", "Quel dessert choisit Zoé ?", ["Un yaourt à la fraise", "Une pomme", "Une glace"], 0], ["Compréhension explicite", "Repas", "Pour le petit déjeuner, Amir mange une tartine avec du fromage. Il boit un verre de lait puis mange une banane.", "Que boit Amir ?", ["Du lait", "Du jus", "De l'eau"], 0], ["Compréhension explicite", "Repas", "À midi, Sami mange du poulet avec du riz. En dessert, il choisit une pomme et boit de l'eau.", "Quel fruit mange Sami ?", ["Une pomme", "Une poire", "Une orange"], 0], ["Compréhension implicite", "Repas", "Maman coupe des légumes, fait chauffer une grande casserole et ajoute de l'eau. Une bonne odeur se répand dans la cuisine.", "Que prépare probablement maman ?", ["Une soupe", "Une glace", "Un gâteau"], 0], ["Compréhension implicite", "Repas", "Après le repas, Jules apporte son verre et ses couverts dans la cuisine. Son père commence à débarrasser le reste.", "Que fait probablement Jules ?", ["Il aide à débarrasser", "Il prépare son petit déjeuner", "Il va dormir"], 0], ["Compréhension explicite", "Fruits et légumes", "Sami choisit trois oranges, deux poires et une grappe de raisin au marché.", "Combien d'oranges achète Sami ?", ["Deux", "Trois", "Quatre"], 1], ["Compréhension explicite", "Fruits et légumes", "Emma récolte des tomates rouges, quelques courgettes et deux salades dans le jardin.", "Que récolte Emma ?", ["Des tomates", "Des fraises", "Des pommes"], 0], ["Compréhension explicite", "Fruits et légumes", "Dans son panier, Lucas met quatre pommes et six carottes.", "Combien de carottes met-il dans son panier ?", ["Quatre", "Cinq", "Six"], 2], ["Compréhension implicite", "Fruits et légumes", "Paul ouvre le réfrigérateur. Il ne reste qu'une carotte, deux pommes de terre et un poireau. Il écrit quelques mots sur une liste avant de sortir.", "Pourquoi écrit-il une liste ?", ["Pour acheter ce qui manque", "Pour préparer un dessin", "Pour compter les légumes"], 0], ["Compréhension implicite", "Fruits et légumes", "Le panier de Chloé contient des fraises, des abricots et des pêches. Elle lave tout avant de les poser dans un saladier.", "Que va probablement préparer Chloé ?", ["Une salade de fruits", "Une soupe", "Une purée"], 0], ["Compréhension explicite", "Saisons", "Au printemps, les jours rallongent. Les premières fleurs apparaissent et les arbres retrouvent leurs feuilles.", "Que retrouvent les arbres ?", ["Leurs feuilles", "De la neige", "Des feuilles mortes"], 0], ["Compréhension explicite", "Saisons", "En hiver, les températures peuvent être très basses. Dans certaines régions, la neige recouvre les routes.", "Que peut recouvrir la neige ?", ["Les routes", "Les arbres fruitiers seulement", "Les cahiers"], 0], ["Compréhension explicite", "Saisons", "En automne, les feuilles de nombreux arbres deviennent jaunes, orange ou rouges avant de tomber.", "De quelles couleurs peuvent devenir les feuilles ?", ["Jaune, orange ou rouge", "Bleu et violet", "Noir et blanc"], 0], ["Compréhension implicite", "Saisons", "Camille porte un bonnet, une écharpe et des gants. Elle souffle dans ses mains et voit du givre sur les branches.", "Quelle saison est probable ?", ["L'hiver", "L'été", "Le printemps"], 0], ["Compréhension implicite", "Saisons", "Les élèves cherchent les coins à l'ombre et remplissent leur gourde avant de sortir dans la cour.", "Pourquoi cherchent-ils l'ombre ?", ["Parce qu'il fait chaud", "Parce qu'il neige", "Parce qu'il fait nuit"], 0], ["Compréhension explicite", "Vêtements", "Pour aller à la piscine, les élèves prennent leur maillot de bain, leur serviette et leurs lunettes.", "Que prennent-ils pour se sécher ?", ["Une serviette", "Un manteau", "Un bonnet en laine"], 0], ["Compréhension explicite", "Vêtements", "Nora choisit un pantalon bleu et un pull vert. Elle ajoute des chaussettes et ses chaussures.", "De quelle couleur est le pantalon ?", ["Bleu", "Vert", "Rouge"], 0], ["Compréhension explicite", "Vêtements", "Pour le cours de sport, Enzo met un short, un tee-shirt et des baskets.", "Quelles chaussures met Enzo ?", ["Des baskets", "Des bottes", "Des sandales"], 0], ["Compréhension implicite", "Vêtements", "Il pleut depuis le matin. Adam enfile une veste imperméable et des bottes avant de sortir.", "Pourquoi choisit-il des bottes ?", ["Pour garder ses pieds au sec", "Pour courir plus vite", "Pour avoir chaud aux mains"], 0], ["Compréhension implicite", "Vêtements", "Mila arrive avec un gros manteau, un bonnet et des gants. Elle garde ses mains dans ses poches pendant la récréation.", "Quel temps fait-il probablement ?", ["Il fait froid", "Il fait très chaud", "Il fait très sec"], 0], ["Compréhension explicite", "Animaux de la forêt", "Léa observe un hérisson qui avance sous les feuilles. Elle reste immobile puis l'animal disparaît dans les buissons.", "Quel animal observe Léa ?", ["Un hérisson", "Un renard", "Un écureuil"], 0], ["Compréhension explicite", "Animaux de la forêt", "Un pic-vert frappe l'écorce d'un arbre avec son bec. Il cherche de petits insectes cachés sous le bois.", "Que cherche le pic-vert ?", ["Des insectes", "Des noisettes", "Des poissons"], 0], ["Compréhension explicite", "Animaux de la forêt", "Un écureuil grimpe sur un arbre et transporte une noisette entre ses dents.", "Que transporte l'écureuil ?", ["Une noisette", "Une pomme", "Une feuille"], 0], ["Compréhension implicite", "Animaux de la forêt", "Tom aperçoit deux petites oreilles derrière un buisson. Puis un animal roux traverse le chemin et disparaît entre les arbres.", "Quel animal est probablement passé ?", ["Un renard", "Une grenouille", "Un poisson"], 0], ["Compréhension implicite", "Animaux de la forêt", "Inès trouve des noisettes ouvertes au pied d'un arbre et de petites traces sur le tronc.", "Quel animal est probablement passé ?", ["Un écureuil", "Un cerf", "Un sanglier"], 0], ["Compréhension explicite", "Animaux de la savane", "Une girafe avance entre les arbres. Grâce à son long cou, elle atteint les feuilles situées très haut.", "Pourquoi la girafe atteint-elle les feuilles hautes ?", ["Grâce à son long cou", "Grâce à ses ailes", "Grâce à ses nageoires"], 0], ["Compréhension explicite", "Animaux de la savane", "Un groupe de zèbres se déplace près d'un point d'eau. Ils boivent puis repartent dans la plaine.", "Que font les zèbres près du point d'eau ?", ["Ils boivent", "Ils construisent un nid", "Ils grimpent"], 0], ["Compréhension explicite", "Animaux de la savane", "Un éléphant utilise sa trompe pour prendre de l'eau et la porter jusqu'à sa bouche.", "Avec quoi prend-il l'eau ?", ["Sa trompe", "Sa queue", "Ses oreilles"], 0], ["Compréhension implicite", "Animaux de la savane", "Le lion reste caché dans les hautes herbes. Il observe attentivement un troupeau qui avance au loin.", "Pourquoi reste-t-il caché ?", ["Pour approcher discrètement une proie", "Pour manger des feuilles", "Pour se protéger de la neige"], 0], ["Compréhension implicite", "Animaux de la savane", "Le soleil est très haut. Les éléphants avancent vers un point d'eau et commencent à boire dès leur arrivée.", "Pourquoi cherchent-ils probablement de l'eau ?", ["Parce qu'ils ont besoin de boire", "Parce qu'ils veulent construire une maison", "Parce qu'ils ont froid"], 0], ["Compréhension explicite", "Récréation et sport", "Arthur et Sami jouent au ballon. Ils se font des passes puis essaient de marquer dans un petit but.", "Quel sport pratiquent-ils probablement ?", ["Le football", "La natation", "Le judo"], 0], ["Compréhension explicite", "Récréation et sport", "Pendant l'athlétisme, les élèves courent jusqu'à un cône puis reviennent. Chacun passe à son tour.", "Jusqu'où courent-ils ?", ["Jusqu'à un cône", "Jusqu'à la cantine", "Jusqu'à la maison"], 0], ["Compréhension explicite", "Récréation et sport", "Sarah fait du vélo dans la cour. Elle porte un casque et suit le parcours tracé par le professeur.", "Que porte Sarah pour se protéger ?", ["Un casque", "Des lunettes de piscine", "Un bonnet"], 0], ["Compréhension implicite", "Récréation et sport", "Sarah tient une raquette et une petite balle. Elle se place face à son camarade, de l'autre côté d'un filet.", "Quel sport vont-ils probablement pratiquer ?", ["Le tennis", "Le football", "La course"], 0], ["Compréhension implicite", "Récréation et sport", "Après plusieurs tours de terrain, Yanis respire rapidement, son visage est rouge et il boit une grande gorgée d'eau.", "Pourquoi boit-il de l'eau ?", ["Parce qu'il vient de faire un effort", "Parce qu'il a terminé son repas", "Parce qu'il veut dessiner"], 0]];
let questions=[],current=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function newGame(){
 const e=shuffle(corpus.filter(x=>x[0].includes("explicite"))).slice(0,5);
 const i=shuffle(corpus.filter(x=>x[0].includes("implicite"))).slice(0,5);
 questions=shuffle([...e,...i]);current=0;score=0;showQuestion();
}
function showQuestion(){
 answered=false;let x=questions[current];
 $("round").textContent=`Question ${current+1} / 10`;$("score").textContent=`Score : ${score}`;
 $("theme").textContent=x[0]+" • "+x[1];$("text").textContent=x[2];$("question").textContent=x[3];
 $("feedback").textContent="";$("next").style.display="none";$("answers").innerHTML="";
 x[4].forEach((a,i)=>{let b=document.createElement("button");b.className="answer";b.textContent=a;b.onclick=()=>choose(i,b);$("answers").appendChild(b)});
}
function choose(i,b){
 if(answered)return;answered=true;let x=questions[current];
 document.querySelectorAll(".answer").forEach((z,j)=>{z.disabled=true;if(j===x[5])z.classList.add("correct")});
 if(i===x[5]){score++;b.classList.add("correct");$("feedback").textContent="🌟 Bravo ! Bonne réponse.";$("feedback").style.color="#15803d"}
 else{b.classList.add("wrong");$("feedback").textContent="💡 Pas tout à fait. La bonne réponse est : "+x[4][x[5]]+".";$("feedback").style.color="#b91c1c"}
 $("score").textContent=`Score : ${score}`;$("next").textContent=current===9?"Voir mon score →":"Question suivante →";$("next").style.display="block";
}
$("next").onclick=()=>{if(current<9){current++;showQuestion()}else finish()};
function finish(){
 $("finalScore").textContent=`${score} / 10`;let title,msg;
 if(score===10){title="🏆 Lecture parfaite !";msg="10 bonnes réponses ! Tu as très bien compris les textes, y compris les informations à déduire."}
 else if(score>=8){title="🌟 Excellent travail !";msg="Tu comprends très bien les textes. Continue à lire attentivement chaque phrase."}
 else if(score>=5){title="👏 Bien joué !";msg="Tu progresses. Pense à utiliser tous les indices du texte, surtout pour les questions implicites."}
 else{title="💪 Continue tes efforts !";msg="Relis attentivement chaque texte et cherche les indices qui permettent de comprendre ce qui n'est pas écrit directement."}
 $("finalTitle").textContent=title;$("finalMessage").textContent=msg;$("overlay").style.display="flex";
}
$("restart").onclick=()=>{$("overlay").style.display="none";newGame()};
document.addEventListener("keydown",e=>{if(!answered&&/^[1-3]$/.test(e.key))document.querySelectorAll(".answer")[Number(e.key)-1]?.click()});
newGame();
</script></body></html>
