<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Défi des Verbes du 1er groupe</title>
<style>
:root{
  --blue:#4dabf7; --orange:#ff922b; --green:#40c057; --pink:#f06595; --purple:#845ef7; --yellow:#ffd43b;
  --ink:#2b2d42;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Trebuchet MS","Comic Sans MS","Segoe UI",Arial,sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,#c5f6fa 0%,#fff3bf 50%,#ffd8e8 100%);
  min-height:100vh;
  touch-action:manipulation;
}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg span{position:absolute;font-size:2.4rem;opacity:.25;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-22px) rotate(8deg)}}
#app{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:14px 14px 40px}

/* En-tête */
.top{background:#fff;border-radius:20px;padding:10px 14px;box-shadow:0 5px 0 rgba(0,0,0,.08);margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:5px 14px;border-radius:999px;font-weight:700;font-size:.95rem;background:#eee;color:#888}
.chip.c1.on{background:var(--blue);color:#fff}
.chip.c2.on{background:var(--orange);color:#fff}
.chip.c3.on{background:var(--green);color:#fff}
.qn{display:flex;justify-content:space-between;margin:8px 4px 4px;font-weight:700}
.bar{height:14px;background:#e9ecef;border-radius:999px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow));border-radius:999px;transition:width .5s}

.card{background:#fff;border-radius:26px;padding:20px 18px 24px;box-shadow:0 8px 0 rgba(0,0,0,.09)}
.theme{display:inline-block;background:#f3f0ff;color:var(--purple);padding:4px 14px;border-radius:999px;font-weight:700;font-size:.95rem}
.inf{font-size:clamp(2.6rem,10vw,4.6rem);font-weight:900;text-align:center;margin:6px 0 2px;letter-spacing:1px;
  background:linear-gradient(90deg,var(--pink),var(--orange),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.inf small{font-size:.35em;display:block;color:#868e96;-webkit-text-fill-color:#868e96;letter-spacing:0;font-weight:700}
.instr{text-align:center;font-size:1.1rem;margin:6px 0 16px;color:#495057}

/* Étiquettes */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px}
.col{display:flex;flex-direction:column;gap:10px}
.tag{font:inherit;font-size:1.35rem;font-weight:800;border:4px solid #dee2e6;background:#f8f9fa;color:var(--ink);
  border-radius:16px;padding:12px 8px;cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:0 4px 0 #ced4da}
.tag:active{transform:translateY(3px);box-shadow:0 1px 0 #ced4da}
.tag.sel{border-color:var(--purple);background:#f3f0ff;transform:scale(1.05)}
.tag.paired{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,#fff);box-shadow:0 4px 0 var(--c)}
.tag.ok{background:#d3f9d8!important;border-color:var(--green)!important;box-shadow:0 4px 0 var(--green)!important}
.tag.ko{background:#ffe3e3!important;border-color:#fa5252!important;box-shadow:0 4px 0 #fa5252!important}
.tag.used{opacity:.3}

/* Partie 2 */
.rows{display:flex;flex-direction:column;gap:8px;max-width:520px;margin:0 auto 18px}
.row{display:flex;align-items:center;gap:6px;font-size:1.6rem;font-weight:800;flex-wrap:wrap}
.row .pr{width:92px;text-align:right;color:var(--blue);padding-right:6px}
.row .pr.ap{width:auto;min-width:92px;text-align:right}
.row .rad{color:var(--ink)}
.slot{font:inherit;font-size:1.4rem;font-weight:800;min-width:78px;min-height:48px;border:4px dashed #adb5bd;background:#fff9db;border-radius:12px;cursor:pointer;padding:2px 10px}
.slot.sel{border-color:var(--purple);background:#f3f0ff}
.slot.filled{border-style:solid;border-color:var(--orange);background:#fff4e6}
.slot.ok{background:#d3f9d8;border-color:var(--green)}
.slot.ko{background:#ffe3e3;border-color:#fa5252}
.corr{font-size:1.1rem;color:#e03131}
.bank{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px;margin:0 auto 14px}

/* Partie 3 */
.ask{text-align:center;font-size:1.3rem;margin-bottom:8px}
.ask b{color:var(--blue);font-size:1.7rem}
.ans{min-height:70px;border:4px solid var(--green);background:#ebfbee;border-radius:18px;font-size:2rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 12px;margin:0 auto 14px;max-width:560px;word-break:break-all}
.ans .pr{color:var(--blue)}
.ans.ok{background:#d3f9d8}.ans.ko{background:#ffe3e3;border-color:#fa5252}
.cursor{animation:blink 1s steps(1) infinite;color:var(--green)}
@keyframes blink{50%{opacity:0}}
.kb{display:flex;flex-direction:column;gap:7px;align-items:center;max-width:640px;margin:0 auto}
.kr{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.key{font:inherit;font-size:1.4rem;font-weight:800;width:clamp(30px,8.4vw,52px);height:52px;border:none;border-radius:12px;background:#e7f5ff;color:var(--ink);
  box-shadow:0 4px 0 #a5d8ff;cursor:pointer}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #a5d8ff}
.key.acc{background:#fff0f6;box-shadow:0 4px 0 #fcc2d7}
.key.wide{width:auto;padding:0 18px;background:#fff3bf;box-shadow:0 4px 0 #ffe066}

.actions{text-align:center;margin-top:14px}
.btn{font:inherit;font-size:1.3rem;font-weight:800;color:#fff;background:linear-gradient(180deg,#51cf66,#2f9e44);border:none;border-radius:999px;padding:12px 34px;cursor:pointer;
  box-shadow:0 6px 0 #237032}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #237032}
.btn:disabled{background:#ced4da;box-shadow:0 6px 0 #adb5bd;cursor:not-allowed}
.btn.alt{background:linear-gradient(180deg,#ffa94d,#f76707);box-shadow:0 6px 0 #b34700}
.btn.big{font-size:1.5rem;padding:14px 44px}

.fb{margin:16px auto 6px;padding:14px 18px;border-radius:18px;font-size:1.15rem;max-width:620px;animation:pop .35s}
.fb.ok{background:#d3f9d8;color:#2b8a3e;text-align:center;font-size:1.5rem;font-weight:800}
.fb.ko{background:#fff0f0;color:#c92a2a}
.fb ul{margin:8px 0 0;padding-left:22px}
.fb li{margin:4px 0;color:var(--ink)}
.fb .good{color:#2b8a3e;font-weight:800}
.fb .bad{color:#e03131;text-decoration:line-through}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}

/* Accueil / fin */
.center{text-align:center}
.title{font-size:clamp(2rem,7vw,3.2rem);font-weight:900;margin:6px 0;background:linear-gradient(90deg,var(--pink),var(--orange),var(--green),var(--blue),var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.mascot{font-size:5rem;animation:float 3s ease-in-out infinite}
.steps{display:grid;gap:10px;margin:18px auto;max-width:600px;text-align:left}
.step{border-radius:16px;padding:10px 14px;font-size:1.05rem;font-weight:600}
.step.s1{background:#e7f5ff}.step.s2{background:#fff4e6}.step.s3{background:#ebfbee}
input.name{font:inherit;font-size:1.3rem;padding:10px 16px;border-radius:14px;border:4px solid #ced4da;text-align:center;max-width:300px;width:100%}
input.name:focus{outline:none;border-color:var(--purple)}
.score{font-size:clamp(3.5rem,16vw,6.5rem);font-weight:900;color:var(--orange);line-height:1}
.stars{font-size:2.4rem;letter-spacing:4px;margin:6px 0}
.msg{font-size:1.4rem;font-weight:700;margin:8px 0 18px}
.err{background:#fff;border:3px solid #ffc9c9;border-radius:18px;padding:12px 16px;margin:12px 0;text-align:left}
.err .eh{font-size:1.15rem}
.err .eh b{font-size:1.3rem;color:var(--purple)}
.err ul{margin:6px 0;padding-left:22px}
.tip{background:#fff9db;border-radius:12px;padding:8px 12px;font-size:.98rem;margin-top:6px}
h2{margin:22px 0 4px}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:50;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media(max-width:520px){
  .tag{font-size:1.15rem;padding:10px 4px}
  .row{font-size:1.3rem}.row .pr{width:70px}.row .pr.ap{min-width:70px}
  .ans{font-size:1.6rem}
}
</style>
</head>
<body>
<div class="bg">
  <span style="left:4%;top:12%">✏️</span><span style="left:88%;top:8%;animation-delay:1s">📚</span>
  <span style="left:8%;top:70%;animation-delay:2s">🌈</span><span style="left:90%;top:62%;animation-delay:3s">⭐</span>
  <span style="left:48%;top:90%;animation-delay:1.5s">🎒</span><span style="left:78%;top:34%;animation-delay:4s">🎨</span>
</div>
<div id="app"></div>

<script>
"use strict";

/* ============ DONNÉES : 100 verbes du 1er groupe ============ */
const THEMES = {
  ecole:['🏫','La vie à l’école'], classe:['✏️','En classe'], materiel:['🎒','Le matériel scolaire'],
  journee:['⏰','La journée'], ferme:['🐄','Les animaux de la ferme'], repas:['🍽️','Les repas'],
  maison:['🏠','À la maison'], fruits:['🍎','Fruits et légumes'], saisons:['🍂','Les saisons'],
  meteo:['⛅','La météo'], vetements:['👕','Les vêtements'], foret:['🦊','Les animaux de la forêt'],
  savane:['🦁','Les animaux de la savane'], recre:['⚽','La récréation'], sport:['🏅','Le sport'],
  corps:['🖐️','Le corps'], reperes:['📍','Se repérer dans l’espace'], couleurs:['🎨','Les couleurs']
};

const RAW = {
  reg: `ecole: écouter parler travailler étudier expliquer demander
materiel: dessiner colorier coller découper gommer tailler
journee: réveiller déjeuner goûter dîner arriver rentrer
maison: laver brosser habiller peigner cuisiner préparer allumer
ferme: brouter galoper bêler meugler ronronner
repas: couper saler griller savourer
fruits: éplucher planter arroser croquer
saisons: ramasser jardiner
meteo: briller souffler tomber
vetements: porter enfiler boutonner attacher
foret: grimper creuser grignoter
savane: chasser guetter barrir
recre: jouer sauter attraper glisser
sport: pédaler marquer gagner dribbler
corps: toucher frotter respirer
reperes: poser monter tourner entrer
couleurs: barbouiller gribouiller`,
  cer: `ecole: commencer
recre: lancer balancer
reperes: avancer placer
materiel: tracer
classe: effacer prononcer
vetements: lacer
corps: pincer`,
  ger: `repas: manger
materiel: ranger
sport: nager plonger
classe: partager corriger
vetements: changer
couleurs: mélanger
recre: bouger
reperes: longer`,
  yer: `repas: payer
vetements: essayer
maison: balayer nettoyer
classe: essuyer employer
corps: appuyer
ferme: aboyer
journee: envoyer
savane: effrayer`
};

const VERBS = [];
for (const type of Object.keys(RAW)) {
  RAW[type].split('\n').forEach(line => {
    const [theme, list] = line.split(':');
    list.trim().split(/\s+/).forEach(inf => VERBS.push({inf, type, theme:theme.trim()}));
  });
}

const PRON = ['je','tu','il','nous','vous','ils'];
const ENDINGS = ['e','es','e','ons','ez','ent'];
const COLORS = ['#ff6b6b','#4dabf7','#40c057','#ff922b','#cc5de8','#15aabf'];

/* ============ OUTILS ============ */
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startsVowel(s){ return /^[aeiouhéèêàâîôûœ]/i.test(s); }
function pronDisp(i, verb){ return (i===0 && startsVowel(verb.inf)) ? 'j’' : PRON[i]; }
function typeLabel(t){ return {reg:'verbe régulier',cer:'verbe en -cer',ger:'verbe en -ger',yer:'verbe en -yer'}[t]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* Conjugaison au présent : retourne [{rad,end,full}] pour je, tu, il, nous, vous, ils */
function conj(verb, variant){
  const stem = verb.inf.slice(0,-2);
  return PRON.map((p,i)=>{
    let rad = stem;
    if (verb.type==='cer' && i===3) rad = stem.slice(0,-1)+'ç';
    if (verb.type==='ger' && i===3) rad = stem+'e';
    if (verb.type==='yer' && variant==='i' && i!==3 && i!==4) rad = stem.slice(0,-1)+'i';
    return {rad, end:ENDINGS[i], full:rad+ENDINGS[i]};
  });
}

function makeQuestion(part, verb){
  let variant = null;
  if (verb.type==='yer') variant = verb.inf.endsWith('ayer') ? (Math.random()<.5?'y':'i') : 'i';
  const q = {part, verb, variant, forms:conj(verb, variant)};
  if (part===3){
    if ((verb.type==='cer'||verb.type==='ger') && Math.random()<.6) q.pron = 3;
    else q.pron = Math.floor(Math.random()*6);
    if (verb.type==='yer' && verb.inf.endsWith('ayer')){
      q.accepted = [...new Set([conj(verb,'y')[q.pron].full, conj(verb,'i')[q.pron].full])];
    } else q.accepted = [q.forms[q.pron].full];
  }
  return q;
}

function buildSession(){
  const reg = shuffle(VERBS.filter(v=>v.type==='reg'));
  const cer = shuffle(VERBS.filter(v=>v.type==='cer'));
  const ger = shuffle(VERBS.filter(v=>v.type==='ger'));
  const yerAll = VERBS.filter(v=>v.type==='yer');
  const ay = yerAll.filter(v=>v.inf.endsWith('ayer'));           // y ou i possibles
  const first = ay[Math.floor(Math.random()*ay.length)];
  const others = shuffle(yerAll.filter(v=>v!==first)).slice(0,2);
  const yers = shuffle([first,...others]);
  const qs = [];
  for (let p=0;p<3;p++){
    shuffle([cer[p],ger[p],yers[p],reg[2*p],reg[2*p+1]]).forEach(v=>qs.push(makeQuestion(p+1,v)));
  }
  return qs;
}

/* ============ ÉTAT ============ */
const app = document.getElementById('app');
let S = {qs:[],i:0,score:0,errors:[],name:''};
let cur = null;

/* ============ ÉCRAN D'ACCUEIL ============ */
function showStart(){
  cur = null;
  app.innerHTML = `
  <div class="card center">
    <div class="mascot">🦉</div>
    <div class="title">Le Défi des Verbes</div>
    <div style="font-size:1.3rem;font-weight:700;color:#495057">Présent de l’indicatif · verbes du 1<sup>er</sup> groupe</div>
    <div class="steps">
      <div class="step s1">🔵 <b>Partie 1</b> (5 questions) : relie chaque pronom à la bonne conjugaison.</div>
      <div class="step s2">🟠 <b>Partie 2</b> (5 questions) : complète les terminaisons.</div>
      <div class="step s3">🟢 <b>Partie 3</b> (5 questions) : écris la conjugaison avec le clavier.</div>
    </div>
    <p style="margin:6px 0 4px;font-weight:700">Comment t’appelles-tu ? (facultatif)</p>
    <input class="name" id="nm" maxlength="20" placeholder="Ton prénom" value="${esc(S.name)}">
    <div class="actions"><button class="btn big" id="go">C’est parti ! 🚀</button></div>
  </div>`;
  document.getElementById('go').onclick = ()=>{
    S.name = document.getElementById('nm').value.trim();
    startGame();
  };
}

function startGame(){
  S.qs = buildSession(); S.i = 0; S.score = 0; S.errors = [];
  showQuestion();
}

/* ============ QUESTION ============ */
function header(){
  const q = S.qs[S.i];
  return `<div class="top">
    <div class="chips">${[1,2,3].map(p=>`<span class="chip c${p} ${q.part===p?'on':''}">Partie ${p}</span>`).join('')}</div>
    <div class="qn"><span>Question ${S.i+1} / 15</span><span>⭐ ${S.score}</span></div>
    <div class="bar"><div class="fill" style="width:${S.i/15*100}%"></div></div>
  </div>`;
}

function showQuestion(){
  const q = S.qs[S.i];
  cur = {q, locked:false};
  const [emo, lab] = THEMES[q.verb.theme];
  const instr = [
    '',
    'Clique sur un pronom, puis sur la conjugaison qui lui correspond. Tu peux cliquer sur une étiquette bleue pour la défaire.',
    'Clique sur une terminaison, puis sur la case où elle va. Valide quand tout est rempli.',
    'Écris la conjugaison qui correspond au pronom, avec le clavier.'
  ][q.part];
  app.innerHTML = header() + `
  <div class="card">
    <span class="theme">${emo} ${lab}</span>
    <div class="inf">${q.verb.inf}<small>${typeLabel(q.verb.type)}</small></div>
    <div class="instr">${instr}</div>
    <div id="stage"></div>
    <div id="fb"></div>
  </div>`;
  window.scrollTo(0,0);
  if (q.part===1) initP1(); else if (q.part===2) initP2(); else initP3();
}

function stage(){ return document.getElementById('stage'); }

/* ---------- PARTIE 1 : relier ---------- */
function initP1(){
  cur.pOrder = shuffle([0,1,2,3,4,5]);
  cur.fOrder = shuffle([0,1,2,3,4,5]);
  cur.pairP = Array(6).fill(null);   // pronom k -> position de l'étiquette
  cur.pairF = Array(6).fill(null);   // position de l'étiquette -> pronom k
  cur.pend = null;
  drawP1();
}
function drawP1(){
  const q = cur.q;
  const all = cur.pairP.every(x=>x!==null);
  let h = '<div class="two"><div class="col">';
  cur.pOrder.forEach(k=>{
    let cls='tag pron';
    if (cur.pend && cur.pend.side==='p' && cur.pend.id===k) cls+=' sel';
    if (cur.pairP[k]!==null) cls+=' paired';
    if (cur.locked) cls+= cur.res[k] ? ' ok':' ko';
    h += `<button type="button" class="${cls}" style="--c:${COLORS[k]}" data-p="${k}">${pronDisp(k,q.verb)}</button>`;
  });
  h += '</div><div class="col">';
  for (let j=0;j<6;j++){
    const k = cur.pairF[j];
    let cls='tag form';
    if (cur.pend && cur.pend.side==='f' && cur.pend.id===j) cls+=' sel';
    if (k!==null) cls+=' paired';
    if (cur.locked && k!==null) cls+= cur.res[k] ? ' ok':' ko';
    h += `<button type="button" class="${cls}" style="--c:${k!==null?COLORS[k]:'#999'}" data-f="${j}">${q.forms[cur.fOrder[j]].full}</button>`;
  }
  h += '</div></div>';
  if (!cur.locked) h += `<div class="actions"><button type="button" class="btn" id="val" ${all?'':'disabled'}>Valider ✔</button></div>`;
  stage().innerHTML = h;
  stage().querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>clickP1('p',+b.dataset.p));
  stage().querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>clickP1('f',+b.dataset.f));
  const v = document.getElementById('val'); if (v) v.onclick = validateP1;
}
function linkP1(k,j){
  if (cur.pairP[k]!==null) cur.pairF[cur.pairP[k]] = null;
  if (cur.pairF[j]!==null) cur.pairP[cur.pairF[j]] = null;
  cur.pairP[k]=j; cur.pairF[j]=k;
}
function clickP1(side,id){
  if (cur.locked) return;
  const pend = cur.pend;
  if (pend && pend.side!==side){
    if (side==='p') linkP1(id,pend.id); else linkP1(pend.id,id);
    cur.pend = null;
  } else if (side==='p' && cur.pairP[id]!==null){
    cur.pairF[cur.pairP[id]] = null; cur.pairP[id] = null; cur.pend = null;
  } else if (side==='f' && cur.pairF[id]!==null){
    cur.pairP[cur.pairF[id]] = null; cur.pairF[id] = null; cur.pend = null;
  } else if (pend && pend.side===side && pend.id===id){
    cur.pend = null;
  } else cur.pend = {side,id};
  drawP1();
}
function validateP1(){
  const q = cur.q; cur.res = []; const wrong = [];
  for (let k=0;k<6;k++){
    const given = q.forms[cur.fOrder[cur.pairP[k]]].full;
    const ok = given === q.forms[k].full;
    cur.res[k] = ok;
    if (!ok) wrong.push({pron:pronDisp(k,q.verb), given, expected:q.forms[k].full, verb:'choisi'});
  }
  finish(wrong, drawP1);
}

/* ---------- PARTIE 2 : terminaisons ---------- */
function initP2(){
  cur.tOrder = shuffle([0,1,2,3,4,5]);
  cur.slot = Array(6).fill(null);    // case -> étiquette
  cur.tagPos = Array(6).fill(null);  // étiquette -> case
  cur.pend = null;
  drawP2();
}
function drawP2(){
  const q = cur.q;
  const all = cur.slot.every(x=>x!==null);
  let h = '<div class="rows">';
  for (let s=0;s<6;s++){
    const pd = pronDisp(s,q.verb);
    let cls='slot';
    if (cur.slot[s]!==null) cls+=' filled';
    if (cur.pend && cur.pend.side==='s' && cur.pend.id===s) cls+=' sel';
    if (cur.locked) cls += cur.res[s] ? ' ok':' ko';
    const val = cur.slot[s]!==null ? ENDINGS[cur.slot[s]] : '';
    h += `<div class="row"><span class="pr ${pd.endsWith('’')?'ap':''}">${pd}</span><span class="rad">${q.forms[s].rad}</span>
      <button type="button" class="${cls}" data-s="${s}">${val||'&nbsp;'}</button>
      ${cur.locked && !cur.res[s] ? `<span class="corr">→ ${q.forms[s].full}</span>`:''}</div>`;
  }
  h += '</div>';
  h += '<div class="bank">';
  cur.tOrder.forEach(t=>{
    let cls='tag';
    if (cur.tagPos[t]!==null) cls+=' used';
    if (cur.pend && cur.pend.side==='t' && cur.pend.id===t) cls+=' sel';
    h += `<button type="button" class="${cls}" data-t="${t}">${ENDINGS[t]}</button>`;
  });
  h += '</div>';
  if (!cur.locked) h += `<div class="actions"><button type="button" class="btn" id="val" ${all?'':'disabled'}>Valider ✔</button></div>`;
  stage().innerHTML = h;
  stage().querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>clickP2('s',+b.dataset.s));
  stage().querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>clickP2('t',+b.dataset.t));
  const v = document.getElementById('val'); if (v) v.onclick = validateP2;
}
function placeP2(s,t){
  if (cur.slot[s]!==null) cur.tagPos[cur.slot[s]] = null;
  if (cur.tagPos[t]!==null) cur.slot[cur.tagPos[t]] = null;
  cur.slot[s]=t; cur.tagPos[t]=s;
}
function clickP2(side,id){
  if (cur.locked) return;
  const pend = cur.pend;
  if (pend && pend.side!==side){
    if (side==='s') placeP2(id,pend.id); else placeP2(pend.id,id);
    cur.pend = null;
  } else if (side==='t' && cur.tagPos[id]!==null){
    cur.slot[cur.tagPos[id]] = null; cur.tagPos[id] = null; cur.pend = null;
  } else if (side==='s' && cur.slot[id]!==null){
    cur.tagPos[cur.slot[id]] = null; cur.slot[id] = null; cur.pend = null;
  } else if (pend && pend.side===side && pend.id===id){
    cur.pend = null;
  } else cur.pend = {side,id};
  drawP2();
}
function validateP2(){
  const q = cur.q; cur.res = []; const wrong = [];
  for (let s=0;s<6;s++){
    const given = ENDINGS[cur.slot[s]];
    const ok = given === q.forms[s].end;
    cur.res[s] = ok;
    if (!ok) wrong.push({pron:pronDisp(s,q.verb), given:q.forms[s].rad+given, expected:q.forms[s].full, verb:'placé'});
  }
  finish(wrong, drawP2);
}

/* ---------- PARTIE 3 : clavier ---------- */
const KB_ROWS = [
  'azertyuiop'.split(''),
  'qsdfghjklm'.split(''),
  'wxcvbn'.split(''),
  'éèêàâçùûîô'.split('')
];
function initP3(){ cur.typed=''; drawP3(); }
function drawP3(){
  const q = cur.q;
  const pd = pronDisp(q.pron,q.verb);
  let cls = 'ans'; if (cur.locked) cls += cur.ok ? ' ok':' ko';
  let h = `<div class="ask">Conjugue <b>${q.verb.inf}</b> avec le pronom : <b>${pd}</b></div>
  <div class="${cls}"><span class="pr">${pd}</span><span><span id="typed">${esc(cur.typed)}</span>${cur.locked?'':'<span class="cursor">|</span>'}</span></div>`;
  if (!cur.locked){
    h += '<div class="kb">';
    KB_ROWS.forEach((row,ri)=>{
      h += '<div class="kr">' + row.map(c=>`<button type="button" class="key ${ri===3?'acc':''}" data-k="${c}">${c}</button>`).join('');
      if (ri===2) h += '<button type="button" class="key wide" data-k="⌫">⌫</button>';
      h += '</div>';
    });
    h += `</div><div class="actions"><button type="button" class="btn" id="val" ${cur.typed.length?'':'disabled'}>Valider ✔</button></div>`;
  }
  stage().innerHTML = h;
  stage().querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>typeKey(b.dataset.k));
  const v = document.getElementById('val'); if (v) v.onclick = validateP3;
}
function typeKey(k){
  if (!cur || cur.q.part!==3 || cur.locked) return;
  if (k==='⌫') cur.typed = cur.typed.slice(0,-1);
  else if (cur.typed.length<25) cur.typed += k;
  drawP3();
}
function validateP3(){
  if (cur.locked || !cur.typed.length) return;
  const q = cur.q;
  let norm = cur.typed.toLowerCase().trim();
  const m = norm.match(/^(je|j[’']|tu|il|nous|vous|ils)\s*(.+)$/);
  if (m && /^(j[’']|.+\s)/.test(norm)) norm = m[2];
  cur.ok = q.accepted.includes(norm);
  const wrong = cur.ok ? [] : [{pron:pronDisp(q.pron,q.verb), given:cur.typed, expected:q.accepted.join(' ou '), verb:'écrit'}];
  finish(wrong, drawP3);
}
document.addEventListener('keydown', e=>{
  if (!cur || cur.q.part!==3 || cur.locked || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key==='Backspace'){ e.preventDefault(); typeKey('⌫'); }
  else if (e.key==='Enter'){ e.preventDefault(); validateP3(); }
  else if (/^[a-zàâäçéèêëîïôöùûüœ]$/i.test(e.key)) typeKey(e.key.toLowerCase());
});

/* ============ CORRECTION ============ */
const PRAISE = ['Bravo !','Super !','Génial !','Excellent !','Quel champion !','Bien joué !'];
function finish(wrong, redraw){
  cur.locked = true;
  const q = cur.q;
  if (wrong.length===0) S.score++;
  else S.errors.push({n:S.i+1, part:q.part, verb:q.verb, wrong});
  redraw();
  const last = S.i===14;
  let h;
  if (wrong.length===0){
    h = `<div class="fb ok">🎉 ${PRAISE[Math.floor(Math.random()*PRAISE.length)]} Tout est juste !</div>`;
    sparkle();
  } else {
    h = `<div class="fb ko"><b>Presque ! Regarde la correction :</b><ul>` +
      wrong.map(w=>`<li><b>${esc(w.pron)}</b> : <span class="bad">${esc(w.given)}</span> → <span class="good">${esc(w.expected)}</span></li>`).join('') +
      `</ul></div>`;
  }
  h += `<div class="actions"><button type="button" class="btn alt big" id="next">${last?'Voir mon score 🏆':'Question suivante →'}</button></div>`;
  document.getElementById('fb').innerHTML = h;
  document.getElementById('next').onclick = ()=>{
    S.i++;
    if (S.i>=15) showEnd(); else showQuestion();
  };
  document.getElementById('next').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ============ FIN ============ */
const TIPS = {
  reg:'Verbe régulier : on garde le radical et on ajoute e, es, e, ons, ez, ent.',
  cer:'Verbe en -cer : à « nous », le c devient ç pour garder le son [s] (nous lançons).',
  ger:'Verbe en -ger : à « nous », on ajoute un e pour garder le son [j] (nous mangeons).',
  yer:'Verbe en -yer : le y devient i devant un e muet (je nettoie, ils nettoient). À « nous » et « vous », on garde le y (nous nettoyons). Pour les verbes en -ayer, y ou i sont possibles (je paie / je paye).'
};
function showEnd(){
  cur = null;
  const sc = S.score;
  const stars = Math.round(sc/3);
  let msg, emo;
  if (sc===15){ msg='Parfait ! Tu es un champion des verbes !'; emo='🏆'; }
  else if (sc>=12){ msg='Bravo, c’est un excellent résultat !'; emo='🌟'; }
  else if (sc>=8){ msg='Bien joué ! Tu progresses vraiment bien !'; emo='👏'; }
  else if (sc>=4){ msg='Courage, tu es sur la bonne voie ! Regarde tes erreurs et réessaie.'; emo='💪'; }
  else { msg='Ne lâche rien ! En t’entraînant, tu vas y arriver !'; emo='🌱'; }
  const name = S.name ? ', '+esc(S.name) : '';
  let errs;
  if (!S.errors.length) errs = '<div class="fb ok">Aucune erreur : tout est parfait ! 🎉</div>';
  else errs = S.errors.map(e=>`
    <div class="err">
      <div class="eh">Question ${e.n} (partie ${e.part}) · <b>${e.verb.inf}</b> <span style="color:#868e96">(${typeLabel(e.verb.type)})</span></div>
      <ul>${e.wrong.map(w=>`<li><b>${esc(w.pron)}</b> : tu as ${w.verb} <span class="bad" style="color:#e03131;text-decoration:line-through">${esc(w.given)}</span> → <span class="good" style="color:#2b8a3e;font-weight:800">${esc(w.expected)}</span></li>`).join('')}</ul>
      <div class="tip">💡 ${TIPS[e.verb.type]}</div>
    </div>`).join('');
  app.innerHTML = `
  <div class="card center">
    <div class="mascot">${emo}</div>
    <div class="title">Terminé${name} !</div>
    <div class="score">${sc}<span style="font-size:.45em;color:#868e96"> / 15</span></div>
    <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(5-stars)}</div>
    <div class="msg">${msg}</div>
    <button type="button" class="btn big" id="again">🔁 Recommencer avec de nouveaux verbes</button>
    <h2>${S.errors.length?'Mes erreurs à revoir':'Mes erreurs'}</h2>
    ${errs}
    <div class="actions"><button type="button" class="btn alt" id="again2">🔁 Recommencer</button></div>
  </div>`;
  window.scrollTo(0,0);
  document.getElementById('again').onclick = startGame;
  document.getElementById('again2').onclick = startGame;
  if (sc>=10) sparkle(70);
}

function sparkle(n){
  n = n || 28;
  const cols = ['#ff6b6b','#ffd43b','#40c057','#4dabf7','#cc5de8','#ff922b'];
  for (let i=0;i<n;i++){
    const d = document.createElement('div');
    d.className='confetti';
    d.style.left = Math.random()*100+'vw';
    d.style.background = cols[i%cols.length];
    d.style.animationDuration = (2+Math.random()*2)+'s';
    d.style.animationDelay = (Math.random()*.5)+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),4800);
  }
}

showStart();
</script>
