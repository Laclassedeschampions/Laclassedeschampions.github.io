    [copy[n], copy[j]] = [copy[j], copy[n]];
  }
  return copy;
}
function startGame() {
  const explicit = shuffle(BANK.filter(item => item.kind === "explicite")).slice(0, 5);
  const implicit = shuffle(BANK.filter(item => item.kind === "implicite")).slice(0, 5);
  questions = shuffle(explicit.concat(implicit));
  position = 0;
  score = 0;
  document.getElementById("score").textContent = "0";
  document.getElementById("game").classList.remove("hidden");
  document.getElementById("finish").classList.add("hidden");
  renderQuestion();
}
function renderQuestion() {
  answered = false;
  const item = questions[position];
  document.getElementById("counter").textContent = "Question " + (position + 1) + " / 10";
  document.getElementById("kind").textContent = item.kind === "explicite" ? "Compréhension explicite" : "Compréhension implicite";
  document.getElementById("passage").textContent = item.passage;
  document.getElementById("question").textContent = item.question;
  const container = document.getElementById("answers");
  container.replaceChildren();
  const choices = shuffle(item.answers.map((label, index) => ({label, correct:index === item.correct})));
  choices.forEach(choice => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "answer";
    button.textContent = choice.label;
    button.addEventListener("click", () => selectAnswer(button, choice.correct));
    container.appendChild(button);
  });
  document.getElementById("feedback").textContent = "";
  document.getElementById("next").style.display = "none";
}
function selectAnswer(selected, isCorrect) {
  if (answered) return;
  answered = true;
  const buttons = Array.from(document.querySelectorAll(".answer"));
  buttons.forEach(button => button.disabled = true);
  if (isCorrect) {
    selected.classList.add("correct");
    score++;
    document.getElementById("score").textContent = String(score);
    document.getElementById("feedback").textContent = "✅ Bonne réponse !";
  } else {
    selected.classList.add("wrong");
    document.getElementById("feedback").textContent = "❌ Ce n'est pas la bonne réponse.";
    const correctText = questions[position].answers[questions[position].correct];
    const correctButton = buttons.find(button => button.textContent === correctText);
    if (correctButton) correctButton.classList.add("correct");
  }
  const next = document.getElementById("next");
  next.textContent = position === 9 ? "Voir mon score →" : "Question suivante →";
  next.style.display = "inline-block";
}
document.getElementById("next").addEventListener("click", () => {
  if (position < 9) {
    position++;
    renderQuestion();
  } else {
    document.getElementById("game").classList.add("hidden");
    document.getElementById("finish").classList.remove("hidden");
    document.getElementById("finalScore").textContent = String(score);
    document.getElementById("message").textContent =
      score === 10 ? "Excellent ! 🏆" :
      score >= 8 ? "Très bon travail ! 👏" :
      score >= 6 ? "Bon travail, continue à chercher les indices du texte. 💪" :
      "Continue tes efforts : relis bien le texte et cherche les indices. 🌟";
  }
});
document.getElementById("restart").addEventListener("click", startGame);
startGame();
</script>
