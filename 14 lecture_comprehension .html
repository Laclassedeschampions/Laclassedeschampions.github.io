<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecture - Je comprends !</title>
<style>
*{box-sizing:border-box}
body{
 margin:0; min-height:100vh; padding:18px;
 font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;
 background:linear-gradient(135deg,#bae6fd,#ddd6fe 52%,#fbcfe8);
 color:#26324a; display:flex; justify-content:center; align-items:center;
}
.app{
 width:min(900px,100%); background:rgba(255,255,255,.97);
 border-radius:30px; padding:28px;
 box-shadow:0 18px 55px rgba(50,40,90,.22);
}
h1{text-align:center;margin:0 0 5px;font-size:clamp(30px,5vw,46px)}
.subtitle{text-align:center;color:#667085;margin:0 0 20px;font-size:18px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.badge,.score{padding:9px 16px;border-radius:999px;font-weight:bold}
.badge{background:#ede9fe;color:#6d28d9}.score{background:#ffedd5;color:#c2410c}
.card{
 background:#f8fafc;border:3px solid #dbeafe;border-radius:24px;
 padding:25px; max-width:780px;margin:auto;
}
.theme{font-size:16px;font-weight:bold;color:#7c3aed;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.text{font-family:Georgia,"Times New Roman",serif;font-size:23px;line-height:1.58;color:#172033}
.question{
 margin-top:24px;padding:17px 19px;background:#fff;border-radius:18px;
 border:2px solid #e2e8f0;font-size:21px;font-weight:bold;
}
.answers{display:grid;gap:12px;margin-top:16px}
.answer{
 border:3px solid #cbd5e1;background:white;border-radius:16px;
 padding:15px 18px;text-align:left;font-size:19px;font-weight:bold;
 cursor:pointer;transition:.15s;
}
.answer:hover{background:#eef2ff;border-color:#a5b4fc}
.answer:focus{outline:4px solid #c4b5fd}
.answer.correct{background:#dcfce7;border-color:#22c55e;color:#166534}
.answer.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.feedback{text-align:center;min-height:40px;padding-top:16px;font-size:20px;font-weight:bold}
.next{
 display:none;margin:8px auto 0;border:0;border-radius:16px;
 background:#7c3aed;color:#fff;padding:13px 25px;font-size:19px;font-weight:bold;
 cursor:pointer;box-shadow:0 5px 0 #5b21b6;
}
.next:active{transform:translateY(4px);box-shadow:0 1px 0 #5b21b6}
.overlay{
 position:fixed;inset:0;background:rgba(35,25,70,.58);
 display:none;align-items:center;justify-content:center;padding:20px;
}
.modal{
 width:min(570px,100%);background:white;border-radius:30px;padding:35px;
 text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)
}
.modal h2{font-size:38px;margin:0 0 10px}
.final-score{font-size:68px;font-weight:bold;color:#7c3aed;margin:10px}
.restart{
 border:0;background:#f97316;color:#fff;border-radius:17px;
 padding:15px 28px;font-size:20px;font-weight:bold;cursor:pointer;
 box-shadow:0 5px 0 #c2410c
}
@media(max-width:600px){
 .app{padding:19px}.card{padding:18px}.text{font-size:20px}
 .question{font-size:19px}.answer{font-size:17px}
}
</style>
</head>
<body>
<main class="app">
<h1>📚 Je comprends !</h1>
<p class="subtitle">Lis attentivement le petit texte, puis choisis la bonne réponse.</p>

<div class="top">
 <div class="badge" id="round">Question 1 / 10</div>
 <div class="score" id="score">Score : 0</div>
</div>

<section class="card">
 <div class="theme" id="theme"></div>
 <div class="text" id="text"></div>
 <div class="question" id="question"></div>
 <div class="answers" id="answers"></div>
 <div class="feedback" id="feedback"></div>
 <button class="next" id="next">Question suivante →</button>
</section>
</main>

<div class="overlay" id="overlay">
 <div class="modal">
  <div style="font-size:40px">🎉 📚 ⭐</div>
  <h2 id="finalTitle">Bravo !</h2>
  <div class="final-score" id="finalScore">0 / 10</div>
  <p id="finalMessage" style="font-size:19px;line-height:1.5"></p>
  <button class="restart" id="restart">🔄 Recommencer</button>
 </div>
</div>

<script>
const questions = [
 {type:"Compréhension explicite",theme:"La vie de classe",
 text:"Chaque matin, Lina pose son manteau au porte-manteau près de la fenêtre. Elle sort ensuite son cahier de français et son stylo bleu. Quand la cloche sonne, elle s'assoit à sa place et attend les consignes de la maîtresse.",
 q:"Où Lina pose-t-elle son manteau ?", a:["Près de la fenêtre","Sous son bureau","Dans le couloir"], c:0},
 {type:"Compréhension explicite",theme:"Les animaux de la ferme",
 text:"Dans la ferme de M. Paul, les poules vivent dans un petit poulailler. Chaque matin, il leur donne des graines et remplit leur abreuvoir. Les poules sortent ensuite dans la cour pour chercher de petits insectes.",
 q:"Que donne M. Paul aux poules le matin ?", a:["Du foin","Des graines","Des pommes"], c:1},
 {type:"Compréhension explicite",theme:"Les saisons",
 text:"En automne, les journées deviennent plus courtes. Les feuilles de nombreux arbres changent de couleur avant de tomber. Dans les parcs, on voit souvent des feuilles jaunes, orange ou rouges sur le sol.",
 q:"Que deviennent les feuilles de nombreux arbres en automne ?", a:["Elles changent de couleur","Elles deviennent plus grandes","Elles disparaissent au printemps"], c:0},
 {type:"Compréhension explicite",theme:"Le repas",
 text:"À midi, Sami mange à la cantine avec ses camarades. Il choisit une salade de tomates en entrée, du poulet avec du riz, puis une pomme en dessert. Il boit un verre d'eau.",
 q:"Quel fruit Sami mange-t-il en dessert ?", a:["Une poire","Une banane","Une pomme"], c:2},
 {type:"Compréhension explicite",theme:"La cour de récréation",
 text:"Pendant la récréation, les élèves sortent dans la cour. Zoé joue à la corde avec deux camarades, tandis que Tom et Yanis font une partie de football. La surveillante reste près du portail.",
 q:"À quoi Zoé joue-t-elle ?", a:["Au football","À la corde","À cache-cache"], c:1},

 {type:"Compréhension implicite",theme:"Les vêtements",
 text:"Ce matin, Hugo regarde par la fenêtre avant de partir à l'école. Le ciel est gris et de grosses gouttes frappent la vitre. Il prend son manteau imperméable et ouvre son parapluie en sortant.",
 q:"Pourquoi Hugo prend-il un manteau imperméable ?", a:["Parce qu'il fait très chaud","Parce qu'il risque de pleuvoir","Parce qu'il va faire du sport"], c:1},
 {type:"Compréhension implicite",theme:"Les animaux de la forêt",
 text:"Nina marche silencieusement dans la forêt avec son grand-père. Soudain, elle aperçoit un petit animal roux qui grimpe rapidement le long d'un tronc et disparaît derrière les branches. Elle n'a pas le temps de le photographier.",
 q:"Quel animal Nina a-t-elle probablement aperçu ?", a:["Un écureuil","Un sanglier","Un hérisson"], c:0},
 {type:"Compréhension implicite",theme:"Le sport",
 text:"Avant le départ de la course, Karim lace soigneusement ses chaussures et s'échauffe en courant doucement. Quand son professeur donne le signal, il part rapidement et garde les yeux fixés sur la ligne d'arrivée. À la fin, il reprend son souffle, tout essoufflé.",
 q:"Quelle activité Karim vient-il probablement de faire ?", a:["Une course","De la natation","Du dessin"], c:0},
 {type:"Compréhension implicite",theme:"La vie de classe",
 text:"La maîtresse demande aux élèves de préparer une affiche sur les animaux. Emma cherche des informations dans un livre, Noé dessine un renard et Inès écrit le titre en grosses lettres. À la fin, ils accrochent leur travail au mur.",
 q:"Quel est probablement le but de cette activité ?", a:["Préparer un travail collectif","Ranger les livres de la classe","Faire une évaluation de calcul"], c:0},
 {type:"Compréhension implicite",theme:"Les fruits et légumes",
 text:"Au marché, Léa remplit son panier. Elle choisit des carottes, des courgettes et des poireaux chez le marchand. Puis elle ajoute quelques pommes bien rouges avant de rentrer chez elle.",
 q:"Que prépare probablement Léa avec les carottes, les courgettes et les poireaux ?", a:["Une soupe ou un plat de légumes","Une salade de fruits","Un gâteau au chocolat"], c:0}
];

let current=0, score=0, answered=false;
const themeEl=document.getElementById("theme"), textEl=document.getElementById("text");
const questionEl=document.getElementById("question"), answersEl=document.getElementById("answers");
const feedbackEl=document.getElementById("feedback"), nextBtn=document.getElementById("next");

function showQuestion(){
 answered=false;
 const item=questions[current];
 document.getElementById("round").textContent=`Question ${current+1} / 10`;
 document.getElementById("score").textContent=`Score : ${score}`;
 themeEl.textContent=item.type+" • "+item.theme;
 textEl.textContent=item.text;
 questionEl.textContent=item.q;
 answersEl.innerHTML="";
 feedbackEl.textContent="";
 nextBtn.style.display="none";
 item.a.forEach((ans,i)=>{
   const b=document.createElement("button");
   b.className="answer";
   b.textContent=ans;
   b.addEventListener("click",()=>choose(i,b));
   answersEl.appendChild(b);
 });
}
function choose(i,button){
 if(answered)return;
 answered=true;
 const item=questions[current];
 document.querySelectorAll(".answer").forEach((b,j)=>{
   b.disabled=true;
   if(j===item.c)b.classList.add("correct");
 });
 if(i===item.c){
   score++;
   button.classList.add("correct");
   feedbackEl.textContent="🌟 Bravo ! Bonne réponse.";
   feedbackEl.style.color="#15803d";
 }else{
   button.classList.add("wrong");
   feedbackEl.textContent="💡 Pas tout à fait. La bonne réponse est : "+item.a[item.c]+".";
   feedbackEl.style.color="#b91c1c";
 }
 document.getElementById("score").textContent=`Score : ${score}`;
 nextBtn.textContent=current===9?"Voir mon score →":"Question suivante →";
 nextBtn.style.display="block";
}
nextBtn.addEventListener("click",()=>{
 if(current<9){current++;showQuestion();}else finish();
});
function finish(){
 document.getElementById("finalScore").textContent=`${score} / 10`;
 let title,msg;
 if(score===10){title="🏆 Lecture parfaite !";msg="10 bonnes réponses ! Tu as très bien compris les textes, y compris les informations à déduire."}
 else if(score>=8){title="🌟 Excellent travail !";msg="Tu comprends très bien les textes. Continue à lire attentivement chaque phrase."}
 else if(score>=5){title="👏 Bien joué !";msg="Tu progresses. Pour les prochaines questions, pense à relier les indices donnés dans le texte."}
 else {title="💪 Continue tes efforts !";msg="Relis tranquillement les textes et cherche les indices qui peuvent t'aider. Tu vas progresser !"}
 document.getElementById("finalTitle").textContent=title;
 document.getElementById("finalMessage").textContent=msg;
 document.getElementById("overlay").style.display="flex";
}
document.getElementById("restart").addEventListener("click",()=>{
 current=0;score=0;document.getElementById("overlay").style.display="none";showQuestion();
});
showQuestion();
</script>
</body>
</html>
