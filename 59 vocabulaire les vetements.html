<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les vêtements</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#ffc400;font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;color:#fff;user-select:none;-webkit-user-select:none}
header{padding:10px 20px 0;text-align:center;font-size:clamp(20px,3.2vw,36px);font-weight:900;text-shadow:2px 3px 0 rgba(0,0,0,.25)}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 16px}
#pic{max-width:94vw;max-height:calc(100vh - 170px);object-fit:contain;background:#fff;border:10px solid #fff;border-radius:28px;box-shadow:0 10px 0 rgba(0,0,0,.2);animation:pop .35s ease}
@keyframes pop{from{transform:scale(.85) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
footer{display:flex;gap:clamp(8px,2vw,20px);justify-content:center;align-items:center;flex-wrap:wrap;padding:10px 12px 18px}
button{font:inherit;font-size:clamp(16px,2.2vw,24px);font-weight:900;color:#fff;border:4px solid #fff;border-radius:20px;padding:10px clamp(14px,2.4vw,28px);cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
#prev{background:#1e88e5}
#next{background:#2e9d3a}
#mix{background:#d81b60}
#full{background:#7b2ff7}
#cnt{background:rgba(255,255,255,.9);color:#e65100;font-weight:900;border-radius:999px;padding:8px 18px;font-size:clamp(16px,2vw,22px);box-shadow:0 4px 0 rgba(0,0,0,.2)}
</style>
</head>

var order=[],i=0,pic=document.getElementById('pic'),cnt=document.getElementById('cnt');
function shuffle(a){for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}return a;}
function mix(){
  var base=IMAGES.map(function(_,k){return k;}),prev=order.join(',');
  var tries=0;
  do{order=shuffle(base.slice());tries++;}while(base.length>2&&order.join(',')===prev&&tries<10);
  i=0;show();
}
function show(){
  pic.style.animation='none';void pic.offsetWidth;pic.style.animation='';
  pic.src=IMAGES[order[i]];
  cnt.textContent=(i+1)+' / '+IMAGES.length;
}
function next(){i=(i+1)%order.length;show();}
function prev(){i=(i-1+order.length)%order.length;show();}
function toggleFull(){
  var d=document,el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}
  else{(el.requestFullscreen||el.webkitRequestFullscreen).call(el);}
}
function fullLabel(){
  var on=document.fullscreenElement||document.webkitFullscreenElement;
  document.getElementById('full').textContent=on?'✖ Quitter plein écran':'⛶ Plein écran';
}
document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
document.getElementById('mix').onclick=mix;
document.getElementById('full').onclick=toggleFull;
document.addEventListener('fullscreenchange',fullLabel);
document.addEventListener('webkitfullscreenchange',fullLabel);
Array.prototype.forEach.call(document.querySelectorAll('button'),function(b){
  b.tabIndex=-1;b.addEventListener('mousedown',function(e){e.preventDefault();});
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '||e.code==='Space'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'){e.preventDefault();prev();}
  else if(e.key==='f'||e.key==='F'){toggleFull();}
});
var sx=null;
document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){
  if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;
  if(Math.abs(dx)>50){dx<0?next():prev();}
},{passive:true});
mix();
