<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passé, présent, futur : le grand quiz ! (intermédiaire)</title>
<style>
:root{
  --past:#ff9f43; --past-d:#e67e22;
  --pres:#2ecc71; --pres-d:#1e9e55;
  --fut:#6c5ce7; --fut-d:#4b3fc4;
  --ink:#2d3436; --bg1:#74b9ff; --bg2:#fd79a8;
  --ok:#2ecc71; --ko:#e74c3c;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",Verdana,sans-serif;
  background:linear-gradient(135deg,var(--bg1),#a29bfe 50%,var(--bg2));
  display:flex; justify-content:center; padding:14px;
}
#app{width:100%; max-width:820px}
header{text-align:center; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,.25); margin-bottom:8px}
header h1{margin:4px 0; font-size:clamp(1.4rem,4.5vw,2.2rem)}
.card{
  background:#fff; border-radius:24px; padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}
.progress{display:flex; gap:5px; justify-content:center; margin-bottom:10px; flex-wrap:wrap}
.dot{width:20px; height:20px; border-radius:50%; background:#dfe6e9; border:2px solid #b2bec3;
  display:flex; align-items:center; justify-content:center; font-size:.7rem; font-weight:bold; color:#636e72}
.dot.cur{background:#ffeaa7; border-color:#fdcb6e; transform:scale(1.25)}
.dot.good{background:var(--ok); border-color:var(--pres-d); color:#fff}
.dot.mid{background:var(--past); border-color:var(--past-d); color:#fff}
.dot.bad{background:var(--ko); border-color:#c0392b; color:#fff}
.partTag{display:inline-block; padding:4px 14px; border-radius:99px; color:#fff; font-weight:bold; margin-bottom:6px}
.p1{background:var(--past-d)} .p2{background:var(--pres-d)} .p3{background:var(--fut-d)}
h2{margin:6px 0 12px; font-size:clamp(1.1rem,3.4vw,1.5rem)}
.hint{color:#636e72; font-size:.95rem; margin:0 0 10px}

button{font-family:inherit; cursor:pointer}
.big{
  border:none; border-radius:16px; padding:12px 22px; font-size:1.15rem; font-weight:bold; color:#fff;
  background:linear-gradient(#ff7675,#d63031); box-shadow:0 5px 0 #a82424; transition:transform .1s;
}
.big:hover{transform:translateY(-2px)}
.big:active{transform:translateY(3px); box-shadow:0 2px 0 #a82424}
.big:disabled{background:#b2bec3; box-shadow:0 5px 0 #8e9aa0; cursor:not-allowed; transform:none}
.big.green{background:linear-gradient(#55efc4,#00b894); box-shadow:0 5px 0 #008a6d}
.big.green:active{box-shadow:0 2px 0 #008a6d}
.center{text-align:center; margin-top:14px}

/* Partie 1 */
.match{display:grid; grid-template-columns:1fr 150px; gap:14px; align-items:start}
.sents{display:flex; flex-direction:column; gap:10px}
.sent{
  text-align:left; border:3px solid #dfe6e9; background:#f9fbfc; border-radius:16px;
  padding:12px 14px; font-size:1.1rem; display:flex; gap:10px; align-items:center; justify-content:space-between;
  min-height:62px;
}
.sent.sel{border-color:#fdcb6e; background:#fff8e1; box-shadow:0 0 0 4px #ffeaa755}
.sent.ok{border-color:var(--ok); background:#eafaf1}
.sent.ko{border-color:var(--ko); background:#fdecea}
.sent .badge{flex:none}
.badge{display:inline-block; padding:3px 10px; border-radius:99px; color:#fff; font-size:.9rem; font-weight:bold; white-space:nowrap}
.b0{background:var(--past-d)} .b1{background:var(--pres-d)} .b2{background:var(--fut-d)}
.tenses{display:flex; flex-direction:column; gap:10px}
.tense{
  border:none; border-radius:16px; padding:14px 8px; color:#fff; font-size:1.15rem; font-weight:bold;
  box-shadow:0 4px 0 rgba(0,0,0,.25); transition:transform .1s;
}
.tense:hover:not(:disabled){transform:scale(1.04)}
.tense:disabled{opacity:.35; cursor:not-allowed}
.t0{background:var(--past)} .t1{background:var(--pres)} .t2{background:var(--fut)}

/* Parties 2 et 3 */
.choices{display:flex; flex-direction:column; gap:12px}
.choice{
  text-align:left; border:3px solid #dfe6e9; background:#f9fbfc; border-radius:16px;
  padding:16px; font-size:1.2rem; display:flex; justify-content:space-between; gap:10px; align-items:center;
}
.choice:hover:not(:disabled){border-color:#74b9ff; background:#eef7ff}
.choice.ok{border-color:var(--ok); background:#eafaf1}
.choice.ko{border-color:var(--ko); background:#fdecea}
.bigSentence{
  font-size:clamp(1.3rem,4.5vw,1.9rem); text-align:center; background:#fff8e1; border:3px dashed #fdcb6e;
  border-radius:20px; padding:24px 14px; margin:8px 0 16px;
}
.labels{display:flex; gap:12px; flex-wrap:wrap; justify-content:center}
.labels .tense{flex:1 1 150px; font-size:1.3rem; padding:18px 10px}

.feedback{margin-top:14px; padding:12px 14px; border-radius:14px; font-weight:bold; font-size:1.1rem; text-align:center}
.feedback.good{background:#d5f5e3; color:#1e8449}
.feedback.bad{background:#fadbd8; color:#a93226}
.feedback.warn{background:#fdebd0; color:#a04000}
.feedback .why{display:block; font-weight:normal; font-size:1rem; margin-top:4px}

/* Accueil / fin */
.hero{text-align:center}
.hero .emoji{font-size:4rem}
.legend{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:14px 0}
.score{font-size:clamp(2.4rem,9vw,4rem); font-weight:bold; color:var(--fut-d); margin:0}
.stars{font-size:2rem; letter-spacing:4px}
.errors{margin-top:18px}
.err{border:2px solid #fab1a0; background:#fff5f2; border-radius:16px; padding:12px 14px; margin-bottom:10px}
.err h4{margin:0 0 6px}
.err ul{margin:4px 0 0; padding-left:0; list-style:none}
.err li{margin:5px 0}
.wrong{text-decoration:line-through; color:#c0392b}
.fall{position:fixed; top:-40px; font-size:1.8rem; pointer-events:none; animation:fall linear forwards; z-index:50}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (max-width:560px){
  .match{grid-template-columns:1fr}
  .tenses{flex-direction:row}
  .tense{flex:1; padding:12px 4px; font-size:1rem}
}
</style>

["La classe a écouté la maîtresse.", "La classe écoutait la maîtresse.", "La classe écoute la maîtresse.", "La classe va écouter la maîtresse.", "La classe écoutera la maîtresse."],
["J'ai tendu mon bras droit.", "Je tendais mon bras droit.", "Je tends mon bras droit.", "Je vais tendre mon bras droit.", "Je tendrai mon bras droit."],
["Tu as fermé les yeux.", "Tu fermais les yeux.", "Tu fermes les yeux.", "Tu vas fermer les yeux.", "Tu fermeras les yeux."],
["Il a plié ses genoux.", "Il pliait ses genoux.", "Il plie ses genoux.", "Il va plier ses genoux.", "Il pliera ses genoux."],
["Nous avons battu des mains.", "Nous battions des mains.", "Nous battons des mains.", "Nous allons battre des mains.", "Nous battrons des mains."],

["Le chat a dormi sous la table.", "Le chat dormait sous la table.", "Le chat dort sous la table.", "Le chat va dormir sous la table.", "Le chat dormira sous la table."],
["J'ai posé mon livre sur l'étagère.", "Je posais mon livre sur l'étagère.", "Je pose mon livre sur l'étagère.", "Je vais poser mon livre sur l'étagère.", "Je poserai mon livre sur l'étagère."],
["L'oiseau a volé au-dessus de la maison.", "L'oiseau volait au-dessus de la maison.", "L'oiseau vole au-dessus de la maison.", "L'oiseau va voler au-dessus de la maison.", "L'oiseau volera au-dessus de la maison."],
["Léa s'est cachée derrière l'arbre.", "Léa se cachait derrière l'arbre.", "Léa se cache derrière l'arbre.", "Léa va se cacher derrière l'arbre.", "Léa se cachera derrière l'arbre."],
["Nous avons marché devant la maîtresse.", "Nous marchions devant la maîtresse.", "Nous marchons devant la maîtresse.", "Nous allons marcher devant la maîtresse.", "Nous marcherons devant la maîtresse."],
["Le ballon a roulé entre les deux chaises.", "Le ballon roulait entre les deux chaises.", "Le ballon roule entre les deux chaises.", "Le ballon va rouler entre les deux chaises.", "Le ballon roulera entre les deux chaises."],
["Les oiseaux ont chanté en haut de l'arbre.", "Les oiseaux chantaient en haut de l'arbre.", "Les oiseaux chantent en haut de l'arbre.", "Les oiseaux vont chanter en haut de l'arbre.", "Les oiseaux chanteront en haut de l'arbre."]
];

/* Transforme une question (5 conjugaisons) en trio [passé, présent, futur] en choisissant au hasard la conjugaison */
function toTriple(r){
  return [ Math.random()<0.5 ? r[0] : r[1], r[2], Math.random()<0.5 ? r[3] : r[4] ];
}

const T = [
  {n:"Passé",   e:"⏮️", art:"au passé"},
  {n:"Présent", e:"📍", art:"au présent"},
  {n:"Futur",   e:"🚀", art:"au futur"}
];
const NQ = 15;

/* ===== Outils ===== */
const $ = id => document.getElementById(id);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!==undefined) e.textContent=txt; return e; }
function fmt(n){ return String(n).replace(".",","); }
function badge(k){ return el("span","badge b"+k, T[k].e+" "+T[k].n); }
function plan(){ // 5 temps, chacun des 3 présent au moins une fois
  return shuffle([0,1,2,Math.floor(Math.random()*3),Math.floor(Math.random()*3)]);
}

/* ===== État ===== */
let Q=[], R=[], cur=0;
const card = $("card");

function clearCard(){ card.innerHTML=""; }

function header(i){
  const wrap = el("div");
  const prog = el("div","progress");
  for(let k=0;k<NQ;k++){
    const d = el("div","dot",String(k+1));
    if(k<i){ const p=R[k].pts; d.classList.add(p===1?"good":(p>0?"mid":"bad")); }
    if(k===i) d.classList.add("cur");
    prog.appendChild(d);
  }
  wrap.appendChild(prog);
  const part = Q[i].part;
  const names = {1:"Partie 1 : relie les phrases",2:"Partie 2 : trouve la bonne phrase",3:"Partie 3 : trouve le temps"};
  wrap.appendChild(el("span","partTag p"+part, names[part]+"  •  Question "+(i+1)+"/"+NQ));
  return wrap;
}

/* ===== Accueil ===== */
function home(){
  clearCard();
  const h = el("div","hero");
  h.appendChild(el("div","emoji","🦉🕰️🌈"));
  h.appendChild(el("h2",null,"Bienvenue, petit explorateur du temps !"));
  const p = el("p",null,"Sauras-tu reconnaître si une phrase est au passé, au présent ou au futur, même quand elle est à l'imparfait ou au futur proche ?");
  h.appendChild(p);
  const lg = el("div","legend");
  [0,1,2].forEach(k=>lg.appendChild(badge(k)));
  h.appendChild(lg);
  const note = el("div",null,"Attention : le passé peut être un passé composé (« j'ai mangé ») ou un imparfait (« je mangeais »). "
    + "Le futur peut être un futur proche (« je vais manger ») ou un futur simple (« je mangerai »).");
  note.style.cssText = "text-align:left;background:#f1f8ff;border:2px solid #74b9ff;border-radius:16px;padding:10px 14px;margin:12px 0;";
  h.appendChild(note);
  const ul = el("p","hint","15 questions • 3 parties • une nouvelle partie à chaque fois ✨");
  h.appendChild(ul);
  const b = el("button","big green","C'est parti ! 🚀");
  b.onclick = startGame;
  h.appendChild(b);
  card.appendChild(h);
}

function startGame(){
  const idx = shuffle([...Array(BANK.length).keys()]).slice(0,NQ);
  const p2 = plan(), p3 = plan();
  Q = idx.map((b,i)=>{
    if(i<5)  return {part:1, t:toTriple(BANK[b])};
    if(i<10) return {part:2, t:toTriple(BANK[b]), target:p2[i-5]};
    return {part:3, t:toTriple(BANK[b]), target:p3[i-10]};
  });
  R = []; cur = 0;
  show();
}

function show(){
  if(cur>=NQ) return finish();
  clearCard();
  card.appendChild(header(cur));
  const q = Q[cur];
  if(q.part===1) part1(q);
  else if(q.part===2) part2(q);
  else part3(q);
}

function next(){ cur++; show(); }

/* ===== Partie 1 : relier ===== */
function part1(q){
  card.appendChild(el("h2",null,"Relie chaque phrase au bon temps."));
  card.appendChild(el("p","hint","1) Clique sur une phrase.  2) Clique sur son temps.  3) Valide !"));
  const items = shuffle([0,1,2]).map(k=>({txt:q.t[k], tense:k}));
  const a = [null,null,null], locked=[false,false,false];
  let sel = 0, tries = 0, finished=false;

  const grid = el("div","match");
  const sents = el("div","sents");
  const tenses = el("div","tenses");
  grid.appendChild(sents); grid.appendChild(tenses);
  card.appendChild(grid);
  const fb = el("div"); card.appendChild(fb);
  const act = el("div","center");
  const vb = el("button","big","Valider ✅"); vb.disabled=true;
  act.appendChild(vb); card.appendChild(act);

  function nextFree(){
    for(let i=0;i<3;i++) if(!locked[i] && a[i]===null) return i;
    return null;
  }
  function draw(res){
    sents.innerHTML=""; tenses.innerHTML="";
    items.forEach((it,i)=>{
      const b = el("button","sent");
      b.appendChild(el("span",null,it.txt));
      if(a[i]!==null) b.appendChild(badge(a[i]));
      if(sel===i && !locked[i] && !finished) b.classList.add("sel");
      if(res){ b.classList.add(res[i] ? "ok":"ko"); }
      b.disabled = locked[i] || finished;
      b.onclick = ()=>{ sel=i; draw(); };
      sents.appendChild(b);
    });
    [0,1,2].forEach(k=>{
      const b = el("button","tense t"+k, T[k].e+" "+T[k].n);
      const usedLocked = a.some((v,i)=>v===k && locked[i]);
      b.disabled = usedLocked || finished;
      b.onclick = ()=>{
        if(sel===null || locked[sel]){ fb.innerHTML=""; fb.appendChild(msg("warn","👆 Clique d'abord sur une phrase !")); return; }
        fb.innerHTML="";
        for(let i=0;i<3;i++) if(a[i]===k && !locked[i]) a[i]=null;
        a[sel]=k;
        sel = nextFree();
        draw();
      };
      tenses.appendChild(b);
    });
    vb.disabled = finished ? false : !a.every(v=>v!==null);
  }
  function msg(cls, txt, why){
    const m = el("div","feedback "+cls, txt);
    if(why) m.appendChild(el("span","why",why));
    return m;
  }
  vb.onclick = ()=>{
    if(finished){ next(); return; }
    const res = items.map((it,i)=>a[i]===it.tense);
    const nOk = res.filter(Boolean).length;
    fb.innerHTML="";
    if(nOk===3){
      finished=true;
      const pts = tries===0 ? 1 : 0.5;
      R[cur] = {pts, tries, type:1, items:items.map((it,i)=>({txt:it.txt,correct:it.tense,given:a[i]})), firstWrong:R[cur]&&R[cur].firstWrong};
      if(tries>0) R[cur].retry=true;
      draw(res);
      fb.appendChild(msg("good", tries===0 ? "🎉 Bravo, tout est juste !" : "👏 Bien corrigé ! Tu as réussi au 2e essai.", tries===0?"":"(½ point)"));
      vb.textContent="Question suivante ➡️"; vb.className="big green";
    } else if(tries===0){
      tries=1;
      const firstGiven = a.slice();
      R[cur] = {firstWrong:firstGiven};
      draw(res);
      res.forEach((ok,i)=>{ if(ok) locked[i]=true; });
      fb.appendChild(msg("warn","🤔 Presque ! Les phrases en rouge sont à corriger.","Tu as droit à un deuxième essai : relis bien le verbe !"));
      // on libère les phrases fausses
      const wrongIdx = res.map((ok,i)=>ok?null:i).filter(v=>v!==null);
      wrongIdx.forEach(i=>{ a[i]=null; });
      sel = wrongIdx[0];
      vb.disabled = true;
      // on garde l'affichage rouge un instant puis on redessine
      setTimeout(()=>{ draw(); },1200);
      R[cur].items = items.map((it,i)=>({txt:it.txt,correct:it.tense,given:firstGiven[i]}));
    } else {
      finished=true;
      const prev = R[cur];
      R[cur] = {pts:0, tries:2, type:1, items:items.map((it,i)=>({txt:it.txt,correct:it.tense,given:(prev.items?prev.items[i].given:a[i])}))};
      // on montre la correction
      for(let i=0;i<3;i++){ a[i]=items[i].tense; }
      draw(items.map((it,i)=>locked[i]));
      fb.appendChild(msg("bad","😯 Ce n'est pas encore ça. Voici la correction :","Regarde bien les étiquettes de couleur et retiens-les !"));
      vb.textContent="Question suivante ➡️"; vb.className="big green";
    }
  };
  draw();
}

/* ===== Partie 2 : clique sur la phrase ===== */
function part2(q){
  const h = el("h2",null,"");
  h.appendChild(document.createTextNode("Clique sur la phrase qui est "));
  const b = badge(q.target); b.style.fontSize="1.2rem"; h.appendChild(b);
  h.appendChild(document.createTextNode(" ."));
  card.appendChild(h);
  const items = shuffle([0,1,2]).map(k=>({txt:q.t[k], tense:k}));
  const box = el("div","choices"); card.appendChild(box);
  const fb = el("div"); card.appendChild(fb);
  const act = el("div","center"); card.appendChild(act);
  let done=false;
  items.forEach(it=>{
    const c = el("button","choice");
    c.appendChild(el("span",null,it.txt));
    c.onclick = ()=>{
      if(done) return; done=true;
      const good = it.tense===q.target;
      R[cur] = {pts:good?1:0, tries:1, type:2, target:q.target, correctTxt:q.t[q.target], givenTxt:it.txt, givenTense:it.tense};
      [...box.children].forEach((btn,i)=>{
        btn.disabled=true;
        btn.appendChild(badge(items[i].tense));
        if(items[i].tense===q.target) btn.classList.add("ok");
        else if(btn===c) btn.classList.add("ko");
      });
      const m = el("div","feedback "+(good?"good":"bad"), good?"🎉 Bravo, c'est la bonne phrase !":"😯 Oups, ce n'est pas celle-ci.");
      if(!good) m.appendChild(el("span","why","La bonne réponse est en vert."));
      fb.appendChild(m);
      const nb = el("button","big green","Question suivante ➡️"); nb.onclick=next; act.appendChild(nb);
    };
    box.appendChild(c);
  });
}

/* ===== Partie 3 : trouve le temps ===== */
function part3(q){
  card.appendChild(el("h2",null,"Lis la phrase. À quel temps est-elle ?"));
  const txt = q.t[q.target];
  card.appendChild(el("div","bigSentence",txt));
  const row = el("div","labels"); card.appendChild(row);
  const fb = el("div"); card.appendChild(fb);
  const act = el("div","center"); card.appendChild(act);
  let done=false;
  [0,1,2].forEach(k=>{
    const b = el("button","tense t"+k, T[k].e+" "+T[k].n);
    b.onclick = ()=>{
      if(done) return; done=true;
      const good = k===q.target;
      R[cur] = {pts:good?1:0, tries:1, type:3, txt, correct:q.target, given:k};
      [...row.children].forEach((btn,i)=>{
        btn.disabled=true;
        if(i===q.target){ btn.disabled=false; btn.style.outline="5px solid #2ecc71"; btn.style.transform="scale(1.06)"; }
        else if(i===k && !good){ btn.style.outline="5px solid #e74c3c"; }
        else btn.style.opacity=.35;
      });
      const m = el("div","feedback "+(good?"good":"bad"), good?"🎉 Bravo, c'est bien "+T[q.target].art+" !":"😯 Oups ! Cette phrase est "+T[q.target].art+".");
      fb.appendChild(m);
      const nb = el("button","big green","Question suivante ➡️"); nb.onclick=next; act.appendChild(nb);
    };
    row.appendChild(b);
  });
}

/* ===== Fin ===== */
function finish(){
  clearCard();
  const total = R.reduce((s,r)=>s+r.pts,0);
  const hero = el("div","hero");
  hero.appendChild(el("p","hint","Ton score"));
  hero.appendChild(el("p","score", fmt(total)+" / "+NQ));
  const nStars = total>=14?3:total>=10?2:total>=6?1:0;
  hero.appendChild(el("div","stars","⭐".repeat(nStars)+"☆".repeat(3-nStars)));
  let m, e;
  if(total===NQ){ e="🏆"; m="PARFAIT ! Tu es un champion du temps ! Aucune erreur, bravo !"; }
  else if(total>=12){ e="🌟"; m="Excellent travail ! Tu maîtrises presque tout, continue comme ça !"; }
  else if(total>=9){ e="👍"; m="Très bien ! Tu progresses vite. Regarde tes erreurs et rejoue pour faire encore mieux !"; }
  else if(total>=5){ e="💪"; m="Bon début ! Avec un peu d'entraînement, tu vas y arriver. Courage !"; }
  else { e="🌱"; m="Ne te décourage pas ! On apprend en s'entraînant. Relis les corrections et retente ta chance !"; }
  hero.appendChild(el("div","emoji",e));
  hero.appendChild(el("h2",null,m));
  const again = el("button","big green","🔄 Recommencer avec de nouvelles questions");
  again.onclick = startGame;
  hero.appendChild(again);
  card.appendChild(hero);

  const bad = R.map((r,i)=>({r,i})).filter(o=>o.r.pts<1);
  const errs = el("div","errors");
  if(bad.length===0){
    errs.appendChild(el("h3",null,"✅ Aucune erreur dans cette partie !"));
  } else {
    errs.appendChild(el("h3",null,"📝 À revoir ("+bad.length+")"));
    bad.forEach(({r,i})=>{
      const box = el("div","err");
      const retry = r.pts===0.5;
      if(r.type===1){
        box.appendChild(el("h4",null,"Question "+(i+1)+" – Relier les phrases"+(retry?" (réussie au 2e essai)":"")));
        const ul = el("ul");
        r.items.slice().sort((x,y)=>x.correct-y.correct).forEach(it=>{
          const li = el("li");
          li.appendChild(badge(it.correct));
          li.appendChild(document.createTextNode(" "+it.txt));
          if(it.given!==null && it.given!==undefined && it.given!==it.correct){
            const w = el("span","wrong"," (tu avais mis : "+T[it.given].n+")");
            li.appendChild(w);
          }
          ul.appendChild(li);
        });
        box.appendChild(ul);
      } else if(r.type===2){
        box.appendChild(el("h4",null,"Question "+(i+1)+" – Clique sur la phrase "+T[r.target].art));
        const ul = el("ul");
        const l1 = el("li"); l1.appendChild(badge(r.target)); l1.appendChild(document.createTextNode(" "+r.correctTxt)); ul.appendChild(l1);
        const l2 = el("li"); const w = el("span","wrong","Tu as choisi : "+r.givenTxt+" "); l2.appendChild(w); l2.appendChild(badge(r.givenTense)); ul.appendChild(l2);
        box.appendChild(ul);
      } else {
        box.appendChild(el("h4",null,"Question "+(i+1)+" – Quel est le temps ?"));
        const ul = el("ul");
        const l1 = el("li"); l1.appendChild(document.createTextNode(r.txt+"  →  ")); l1.appendChild(badge(r.correct)); ul.appendChild(l1);
        const l2 = el("li"); l2.appendChild(el("span","wrong","Tu avais répondu : "+T[r.given].n)); ul.appendChild(l2);
        box.appendChild(ul);
      }
      errs.appendChild(box);
    });
    errs.appendChild(el("p","hint","Astuce : le passé (passé composé ou imparfait) parle de ce qui est fini, le présent de ce qui se passe maintenant, le futur (futur proche ou futur simple) de ce qui va arriver."));
  }
  card.appendChild(errs);
  const again2 = el("div","center");
  const b2 = el("button","big","🔄 Rejouer !"); b2.onclick=startGame; again2.appendChild(b2);
  card.appendChild(again2);
  if(total>=9) confetti();
  window.scrollTo({top:0,behavior:"smooth"});
}

function confetti(){
  const em = ["🎉","⭐","🌈","🎈","✨","🦄","🏅"];
  for(let i=0;i<36;i++){
    const s = el("span","fall",em[Math.floor(Math.random()*em.length)]);
    s.style.left = Math.random()*100+"vw";
    s.style.animationDuration = (2.5+Math.random()*2.5)+"s";
    s.style.animationDelay = (Math.random()*1.2)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),7000);
  }
}

home();
</script>
