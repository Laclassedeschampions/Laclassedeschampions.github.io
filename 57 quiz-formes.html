<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz des formes</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Comic Sans MS", "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e8 0%, #fff3b0 35%, #c9f2ff 70%, #d9ccff 100%);
    color: #3b2f63;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  .app {
    width: 100%;
    max-width: 860px;
    background: rgba(255,255,255,0.88);
    border-radius: 28px;
    padding: 20px 22px 26px;
    box-shadow: 0 10px 30px rgba(80, 50, 140, 0.2);
    border: 4px solid #fff;
  }
  h1 { margin: 0 0 6px; text-align: center; font-size: 2rem; color: #6a3de8; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* Accueil */
  .intro { text-align: center; padding: 10px 0; }
  .intro p { font-size: 1.25rem; margin: 10px 0 20px; }
  .parade { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0 20px; }
  .parade svg { width: 56px; height: 56px; animation: bounce 1.6s ease-in-out infinite; }
  .parade svg:nth-child(2n) { animation-delay: .25s; }
  .parade svg:nth-child(3n) { animation-delay: .5s; }
  @keyframes bounce { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }

  .big-btn {
    font-family: inherit;
    font-size: 1.5rem;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(180deg, #ff8a3d, #ff5a5f);
    border: none;
    border-radius: 999px;
    padding: 14px 38px;
    cursor: pointer;
    box-shadow: 0 6px 0 #c9393e;
    transition: transform .1s, box-shadow .1s;
  }
  .big-btn:hover { transform: translateY(-2px); }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c9393e; }

  /* Quiz */
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .counter { font-weight: bold; font-size: 1.1rem; white-space: nowrap; }
  .progress { flex: 1; height: 16px; background: #e6defa; border-radius: 999px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: linear-gradient(90deg, #4cd964, #00c2ff, #8a5cff); border-radius: 999px; transition: width .4s; }
  .scorebox { font-weight: bold; font-size: 1.1rem; white-space: nowrap; color: #e08a00; }

  .question { text-align: center; font-size: 1.6rem; font-weight: bold; margin: 6px 0; }
  .shape-zone {
    display: flex; justify-content: center; align-items: center;
    background: #fff; border-radius: 22px; border: 4px dashed #c7b6ff;
    height: 190px; margin: 8px auto 16px; max-width: 320px;
  }
  .shape-zone svg { width: 150px; height: 150px; animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.4); opacity: 0 } to { transform: scale(1); opacity: 1 } }

  .labels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .label-btn {
    font-family: inherit;
    font-size: 1.15rem;
    font-weight: bold;
    padding: 14px 6px;
    border-radius: 16px;
    border: 3px solid #d9c7a3;
    background: #f5e6c8;
    color: #5a4630;
    cursor: pointer;
    box-shadow: 0 4px 0 #cdb98f;
    transition: transform .1s;
  }
  .label-btn:hover:not(:disabled) { transform: translateY(-3px) scale(1.03); }
  .label-btn:disabled { cursor: default; }
  .label-btn.good { outline: 5px solid #1fb94a; background: #1fb94a !important; color: #fff; border-color: #1fb94a; transform: scale(1.06); }
  .label-btn.bad { outline: 5px solid #e53935; background: #e53935 !important; color: #fff; border-color: #e53935; animation: shake .4s; }
  .label-btn.faded { opacity: .45; }
  @keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }

  .feedback { min-height: 64px; text-align: center; font-size: 1.4rem; font-weight: bold; margin-top: 16px; }
  .feedback.good { color: #1fb94a; }
  .feedback.bad { color: #d6302c; }
  .timer { height: 8px; border-radius: 999px; background: #e6defa; overflow: hidden; margin-top: 6px; opacity: 0; }
  .timer.on { opacity: 1; }
  .timer > div { height: 100%; width: 100%; background: #8a5cff; }
  .timer.on > div { animation: drain 3s linear forwards; }
  @keyframes drain { from { width: 100% } to { width: 0 } }

  /* Résultat */
  .result { text-align: center; }
  .score-circle {
    width: 170px; height: 170px; border-radius: 50%;
    margin: 8px auto 12px;
    background: conic-gradient(#ff5a5f, #ffb703, #4cd964, #00c2ff, #8a5cff, #ff5a5f);
    display: flex; align-items: center; justify-content: center;
  }
  .score-circle > div {
    width: 140px; height: 140px; border-radius: 50%; background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.6rem; font-weight: bold; color: #6a3de8;
  }
  .encourage { font-size: 1.5rem; font-weight: bold; margin: 6px 0 16px; }
  .errors { text-align: left; margin: 20px 0; }
  .errors h2 { text-align: center; font-size: 1.4rem; color: #d6302c; margin: 0 0 10px; }
  .error-item {
    display: flex; align-items: center; gap: 14px;
    background: #fff; border-radius: 16px; padding: 8px 14px; margin-bottom: 8px;
    border-left: 8px solid #ff5a5f; font-size: 1.1rem;
  }
  .error-item svg { width: 60px; height: 60px; flex: none; }
  .error-item .wrong { color: #d6302c; text-decoration: line-through; }
  .error-item .right { color: #1fb94a; font-weight: bold; }
  .no-error { text-align: center; font-size: 1.3rem; color: #1fb94a; font-weight: bold; margin: 20px 0; }

  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 50; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  @media (max-width: 640px) {
    .labels { grid-template-columns: repeat(3, 1fr); }
    h1 { font-size: 1.5rem; }
  }
  @media (max-width: 440px) {
    .labels { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="app">
  <h1>🌈 Le quiz des formes 🌈</h1>

  <!-- ACCUEIL -->
  <div id="screen-start" class="screen active">
    <div class="intro">
      <div class="parade" id="parade"></div>
      <p>Sauras-tu reconnaître les 12 formes ?<br>Clique sur le bon nom !</p>
      <button class="big-btn" id="btn-start">▶ Jouer</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="screen-quiz" class="screen">
    <div class="topbar">
      <div class="counter" id="counter">Question 1 / 12</div>
      <div class="progress"><div id="progress-bar"></div></div>
      <div class="scorebox" id="live-score">⭐ 0</div>
    </div>
    <div class="question">Quelle est cette forme ?</div>
    <div class="shape-zone" id="shape-zone"></div>
    <div class="labels" id="labels"></div>
    <div class="feedback" id="feedback"></div>
    <div class="timer" id="timer"><div></div></div>
  </div>

  <!-- RÉSULTAT -->
  <div id="screen-result" class="screen">
    <div class="result">
      <div class="score-circle"><div id="final-score">0/12</div></div>
      <div class="encourage" id="encourage"></div>
      <button class="big-btn" id="btn-restart">🔄 Recommencer</button>
      <div class="errors" id="errors"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- Les 12 formes (dans l'ordre fixe des étiquettes) ---------- */
  var SHAPES = [
    { id: "carre",     label: "un carré",     color: "#ef476f",
      svg: '<rect x="20" y="20" width="60" height="60" fill="#ef476f"/>' },
    { id: "rectangle", label: "un rectangle", color: "#118ab2",
      svg: '<rect x="6" y="28" width="88" height="44" fill="#118ab2"/>' },
    { id: "etoile",    label: "une étoile",   color: "#f5a300",
      svg: '<polygon points="50,6 61,37 94,37 67,57 77,90 50,70 23,90 33,57 6,37 39,37" fill="#ffc300" stroke="#f5a300" stroke-width="2" stroke-linejoin="round"/>' },
    { id: "triangle",  label: "un triangle",  color: "#06a77d",
      svg: '<polygon points="50,12 92,86 8,86" fill="#06a77d"/>' },
    { id: "cercle",    label: "un cercle",    color: "#8a5cff",
      svg: '<circle cx="50" cy="50" r="40" fill="#8a5cff"/>' },
    { id: "fleche",    label: "une flèche",   color: "#ff7b00",
      svg: '<polygon points="6,38 56,38 56,16 94,50 56,84 56,62 6,62" fill="#ff7b00"/>' },
    { id: "croissant", label: "un croissant", color: "#e0a800",
      svg: '<defs><mask id="m-croissant"><rect width="100" height="100" fill="white"/><circle cx="68" cy="38" r="32" fill="black"/></mask></defs>' +
           '<circle cx="50" cy="52" r="40" fill="#ffd23f" mask="url(#m-croissant)"/>' },
    { id: "ovale",     label: "un ovale",     color: "#00b4d8",
      svg: '<ellipse cx="50" cy="50" rx="28" ry="42" fill="#00b4d8"/>' },
    { id: "coeur",     label: "un cœur",      color: "#e63946",
      svg: '<path d="M50 90 C8 60 4 30 27 19 C40 13 48 21 50 30 C52 21 60 13 73 19 C96 30 92 60 50 90 Z" fill="#e63946"/>' },
    { id: "losange",   label: "un losange",   color: "#9d4edd",
      svg: '<polygon points="50,6 86,50 50,94 14,50" fill="#c77dff" stroke="#9d4edd" stroke-width="3" stroke-linejoin="round"/>' },
    { id: "croix",     label: "une croix",    color: "#2a9d8f",
      svg: '<polygon points="37,8 63,8 63,37 92,37 92,63 63,63 63,92 37,92 37,63 8,63 8,37 37,37" fill="#2a9d8f"/>' },
    { id: "arc",       label: "un arc",       color: "#fb5607",
      svg: '<path d="M12 74 A38 38 0 0 1 88 74" fill="none" stroke="#fb5607" stroke-width="12" stroke-linecap="round"/>' }
  ];

  function svgOf(shape, size) {
    return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
           shape.svg.replace(/m-croissant/g, "m-croissant-" + (size || "x")) + '</svg>';
  }
  // pour éviter les doublons d'identifiant de masque dans la page
  var uid = 0;
  function svgUnique(shape) {
    uid++;
    return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
           shape.svg.replace(/m-croissant/g, "m-croissant-" + uid) + '</svg>';
  }

  var $ = function (id) { return document.getElementById(id); };
  var TOTAL = 12, DELAY = 3000;

  var order, index, score, mistakes, locked, timeoutId;

  /* ---------- Utilitaires ---------- */
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function show(name) {
    ["start", "quiz", "result"].forEach(function (n) {
      $("screen-" + n).classList.toggle("active", n === name);
    });
  }
  function confetti(n) {
    var colors = ["#ef476f","#ffc300","#06a77d","#118ab2","#8a5cff","#ff7b00"];
    for (var i = 0; i < n; i++) {
      var c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (2 + Math.random() * 2) + "s";
      c.style.animationDelay = (Math.random() * 0.6) + "s";
      document.body.appendChild(c);
      setTimeout((function (el) { return function () { el.remove(); }; })(c), 5000);
    }
  }

  /* ---------- Accueil : défilé de formes ---------- */
  $("parade").innerHTML = SHAPES.map(svgUnique).join("");

  /* ---------- Étiquettes (toujours dans le même ordre) ---------- */
  function buildLabels() {
    var box = $("labels");
    box.innerHTML = "";
    SHAPES.forEach(function (s, i) {
      var b = document.createElement("button");
      b.className = "label-btn";
      b.type = "button";
      b.textContent = s.label;
      b.dataset.id = s.id;
      b.addEventListener("click", function () { answer(s.id); });
      box.appendChild(b);
    });
  }

  /* ---------- Déroulement ---------- */
  function start() {
    clearTimeout(timeoutId);
    order = shuffle(SHAPES);          // 12 formes, ordre aléatoire à chaque partie
    index = 0; score = 0; mistakes = [];
    buildLabels();
    show("quiz");
    showQuestion();
  }

  function showQuestion() {
    locked = false;
    var shape = order[index];
    $("counter").textContent = "Question " + (index + 1) + " / " + TOTAL;
    $("progress-bar").style.width = (index / TOTAL * 100) + "%";
    $("live-score").textContent = "⭐ " + score;
    $("shape-zone").innerHTML = svgUnique(shape);
    $("feedback").textContent = "";
    $("feedback").className = "feedback";
    var t = $("timer"); t.classList.remove("on");
    Array.prototype.forEach.call($("labels").children, function (b) {
      b.disabled = false;
      b.classList.remove("good", "bad", "faded");
    });
  }

  function answer(chosenId) {
    if (locked) return;
    locked = true;
    var shape = order[index];
    var fb = $("feedback");
    var ok = chosenId === shape.id;

    Array.prototype.forEach.call($("labels").children, function (b) {
      b.disabled = true;
      if (b.dataset.id === shape.id) b.classList.add("good");
      else if (b.dataset.id === chosenId) b.classList.add("bad");
      else b.classList.add("faded");
    });

    if (ok) {
      score++;
      var praises = ["Bravo ! 🎉", "Super ! 🌟", "Excellent ! 👏", "Bien joué ! 🥳", "Génial ! 🚀"];
      fb.textContent = praises[Math.floor(Math.random() * praises.length)] +
                       " C’est bien " + shape.label + ".";
      fb.className = "feedback good";
      confetti(14);
    } else {
      var chosen = SHAPES.filter(function (s) { return s.id === chosenId; })[0];
      mistakes.push({ shape: shape, chosen: chosen });
      fb.textContent = "Pas tout à fait… 🤔 C’était " + shape.label + ".";
      fb.className = "feedback bad";
    }
    $("live-score").textContent = "⭐ " + score;

    var t = $("timer");
    t.classList.remove("on");
    void t.offsetWidth;               // relance l'animation
    t.classList.add("on");

    timeoutId = setTimeout(next, DELAY);
  }

  function next() {
    index++;
    if (index >= TOTAL) { finish(); } else { showQuestion(); }
  }

  function finish() {
    $("progress-bar").style.width = "100%";
    $("final-score").textContent = score + "/" + TOTAL;

    var msg;
    if (score === 12)      msg = "🏆 Parfait ! Tu es un champion des formes !";
    else if (score >= 10)  msg = "🌟 Excellent travail, presque parfait !";
    else if (score >= 7)   msg = "👏 Très bien ! Tu connais bien les formes !";
    else if (score >= 4)   msg = "💪 C’est un bon début, continue, tu progresses !";
    else                   msg = "🌱 Courage ! Avec un peu d’entraînement, tu y arriveras !";
    $("encourage").textContent = msg;

    var err = $("errors");
    if (mistakes.length === 0) {
      err.innerHTML = '<div class="no-error">✅ Aucune erreur dans cette partie, bravo !</div>';
    } else {
      var html = "<h2>📝 Les formes à revoir</h2>";
      mistakes.forEach(function (m) {
        html += '<div class="error-item">' + svgUnique(m.shape) +
                '<div>C’était <span class="right">' + m.shape.label + '</span>.<br>' +
                'Tu as répondu : <span class="wrong">' + m.chosen.label + '</span></div></div>';
      });
      err.innerHTML = html;
    }
    show("result");
    if (score >= 7) confetti(score === 12 ? 80 : 40);
  }

  $("btn-start").addEventListener("click", start);
  $("btn-restart").addEventListener("click", start);
})();
</script>
</body>
</html>
